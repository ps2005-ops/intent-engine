[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-engine"
version = "0.1.0"
requires-python = ">=3.9"
# Runtime dependencies of the DEPLOYED service. Deployment builds with
# `pip install -e .` (see render.yaml) and never reads requirements.txt, so a
# dependency the deployed code needs has to be declared HERE or it is simply
# absent in production. Everything else in the ingestion path is stdlib
# (urllib); pypdf is the one exception, and without it every investor PDF
# degrades to "PDF support is not installed in this deployment" forever.
# requirements.txt keeps the exact pin for reproducible CI.
# Pinned, not a range. A range meant a production build resolved to whatever
# pypdf was newest that day (observed: 5.9.0) while CI tested the 5.1.0 pinned
# in requirements.txt — two different libraries under one "verified" claim,
# and two deploys of the same commit could differ. A frozen release must build
# the same way twice.
# pydantic is imported by intent_engine.learning.records, which WebApp.__init__
# imports to build the read-only learning surface. It was in requirements.txt
# only, so a clean `pip install -e .` deployment imported the webapp module
# fine and then raised ModuleNotFoundError the moment it CONSTRUCTED the app —
# the service could not start at all. It survived only because the live
# instance was built before the dependency moved, which is not a property any
# future deploy can rely on. Found by booting the installed package in a
# clean-room, which is the only check that exercises construction rather than
# import.
# anthropic and python-dotenv are what the GROUNDED ANALYST needs, and they
# were in requirements.txt only -- so a production build had neither. With
# ANTHROPIC_API_KEY set, `default_client` gets past its "is a key configured"
# guard and then raises ModuleNotFoundError on `import anthropic`, which is
# worse than the honest "no reasoning backend" path it was trying to reach.
# This is the third time a runtime dependency lived only in requirements.txt
# (pypdf, then pydantic, now these two); the deployment builds with
# `pip install -e .` and never reads that file.
dependencies = [
    "pypdf==5.1.0",
    "pydantic==2.13.4",
    "anthropic==0.116.0",
    "python-dotenv==1.2.1",
]

[project.scripts]
premortem = "intent_engine.simulator.cli:main"
delegate = "intent_engine.voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
