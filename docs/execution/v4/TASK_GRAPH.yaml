    minimum_data: none

  - id: G-THE-001
    program: G
    title: Thesis revision history answering "what changed your mind"
    dependencies: []
    status: READY
    priority: 3
    acceptance_criteria:
      - created / strengthened / weakened / contested / superseded transitions
