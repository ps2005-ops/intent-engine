  # is elaborated when its dependencies clear.

  - id: F-ORD-001
    program: F
    title: Second-order consequences require a named mediator
    dependencies: [D-REP-003]
    status: WAITING_DEPENDENCY
    priority: 4
    acceptance_criteria:
