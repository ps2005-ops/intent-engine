    status: PARTIAL
    note: 15/30 macro conditions populated
  TEMPORAL_VINTAGE_TRUTH:
    status: PASS
    note: 'D-REP-001. The wall raises rather than filtering; admission is by observation time, never occurrence,
      so a fact that happened before T but was published after it stays invisible. leak_surface measures
      how many rows an occurrence-time filter would have admitted. 19 tests.

      '
