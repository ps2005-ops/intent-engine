      persistence: reports/market/historical_corpus.jsonl, population=HISTORICAL
      reload: episodes reload and the T0 wall is re-asserted on load
      consumer: B-RM-001 reward model and A-DIAG-001 estimator validation
      surface: a historical validation block in the cycle report
      telemetry: episodes built / refused by wall violation reason
      failure_states: WALL_VIOLATION, REVISED_OUTCOME, NO_OBSERVABLE,
        INSUFFICIENT_PROVENANCE
      live_proof: a built corpus file with a non-zero refusal count
      adversarial_proof: an episode seeded with a post-T0 fact must be refused
      mutation_target: the T0 comparison in the wall

  - id: B-HIST-002
    program: B
    status: COMPLETE
    verification: CAPABILITY_VERIFIED
    completion_evidence: >
      af37ba8, merged at aff8888 — positive population filter at the gate arithmetic. Found a live defect: prospective_outcomes counted EVERY research_outcome row with no filter of any kind, so 1,000 imported historical rows would have moved it by 1,000. Measured on the live ledger the repair moves nothing today (35/35 before and after, 0 untagged), which is what a latent defect looks like before it fires.
    title: HISTORICAL and PROSPECTIVE populations separated at write and at read
    dependencies: [B-HIST-001]
    priority: 1
    expected_value: >
      The wall is only real if it is enforced where the counting happens. This
      node makes population a required field, makes every gate query
      population-explicit, and adds a check that fails if any prospective
      metric's denominator ever includes a historical row.
    acceptance_criteria:
      - population is a required, typed field on every decision-like record
      - metrics.py prospective_* gates filter on population=PROSPECTIVE and a
        test proves a historical row cannot move them
      - a mixed query must name both populations explicitly; there is no default
      - the separation is checked by a guard that runs in the test suite
    tests: tests/test_market_population_separation.py
    minimum_data: none
    vertical:
      producer: the population tag written by every decision producer
      persistence: population field on ledger and corpus rows
      reload: readers refuse an untagged row rather than defaulting it
      consumer: docs/execution/v4/metrics.py and v5/metrics.py
      surface: gate readouts in both frontier reports
      telemetry: rows by population per cycle
      failure_states: UNTAGGED_ROW_REFUSED, MIXED_QUERY_UNSPECIFIED
      live_proof: v4 metrics unchanged after a historical corpus is built
