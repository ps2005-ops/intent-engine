    minimum_data: none
    completion_evidence: null

  - id: C-MET-002
    program: C
    title: MethodAssumptionCheck ledger
    dependencies: [C-MET-001]
    status: WAITING_DEPENDENCY
    priority: 3
    acceptance_criteria:
      - assumptions persisted per evaluation with pass/fail and evidence
      - a failed critical assumption yields REFUSED, never a fabricated estimate
    minimum_data: none
    completion_evidence: null

  - id: C-MET-003
    program: C
    title: One real historical causal study
    dependencies: [C-MET-002]
    status: WAITING_DEPENDENCY
    priority: 4
    acceptance_criteria:
      - economically meaningful question chosen on stated criteria
      - vintage-safe data; outcome NOT inspected during selection
      - descriptive baseline PLUS one formal method whose assumptions hold
      - result stores estimand, sample, period, effect, uncertainty,
        assumption status, alternative interpretation, standing
    minimum_data: macro series depth sufficient for the chosen estimand
    completion_evidence: null

  # ---- PROGRAM D: HISTORICAL SCIENTIFIC VALIDATION ----------------------

  - id: D-REP-001
    program: D
    title: Vintage wall for replay
    dependencies: []
    status: READY
    priority: 3
    acceptance_criteria:
      - data access at historical T is restricted to what existed at T
      - a leakage attempt raises rather than warns
    minimum_data: none
    completion_evidence: null

  - id: D-REP-002
    program: D
    title: Historical thesis replay with deterministic episode selection
    dependencies: [D-REP-001]
    status: WAITING_DEPENDENCY
    priority: 4
    acceptance_criteria:
      - episodes chosen by date window / data availability / event type BEFORE
        outcomes are inspected
      - wins, losses and ambiguous results all retained
    minimum_data: episodes with sufficient pre-period coverage >= 3
    completion_evidence: null

  - id: D-REP-003
    program: D
    title: Outcome vs mechanism scoring
    dependencies: [D-REP-002]
    status: WAITING_DEPENDENCY
    priority: 4
    acceptance_criteria:
      - OUTCOME_RIGHT_MECHANISM_RIGHT / OUTCOME_RIGHT_MECHANISM_WRONG /
        OUTCOME_WRONG_MECHANISM_PLAUSIBLE / OUTCOME_WRONG_MECHANISM_WRONG /
        UNRESOLVED
      - feeds mechanism calibration; unrelated mechanisms are not pooled
    minimum_data: none
    completion_evidence: null

  # ---- PROGRAM E: WORLD MODEL -------------------------------------------

  - id: E-DEM-001
    program: E
    title: Targeted demand-variable extraction
    dependencies: []
    status: READY
    priority: 3
    expected_value: >
      Measured 21/260 company-state cells and 15/26 companies with any state.
      The layer works; the corpus is thin. Targeted extraction from filings and
      earnings is the lever, not generic web copy.
    acceptance_criteria:
      - orders, bookings, RPO, backlog, contract liabilities, cancellations,
        shipments, customer adds, usage
      - coverage measured before and after
    minimum_data: none
    completion_evidence: null

  - id: E-DEM-002
    program: E
    title: Demand-state contradiction handling
    dependencies: [E-DEM-001]
    status: WAITING_DEPENDENCY
    priority: 4
    acceptance_criteria:
      - backlog up with cancellations up, revenue up with bookings down, orders
        up with shipments constrained are all representable
      - never flattened to "demand strong"
    minimum_data: none
    completion_evidence: null

  # ---- PROGRAM F/G/H/I: parked behind their prerequisites ---------------
