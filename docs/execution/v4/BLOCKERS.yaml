# Standing blockers. A blocker parks its node and that node's descendants.
# It does not stop the program.
#
# A blocker must quantify the shortfall. "More data would be useful" is not a
# blocker; "prospective_decisions 0 / 100 required" is.

contract: v4_blockers.v1

blockers:

  - id: BLK-PROSPECTIVE-SAMPLE
    class: BLOCKED_DATA
    blocks: [B-POL-002, B-VOI-002, B-HACK-001, B-BANDIT-001]
    measured: "prospective_decisions = 2 (first written 2026-08-09)"
    required: "100 for policy comparison and hack audit; 50 for VOI calibration"
    why: >
      The research log is reconstructed from evidence that survived. Actions
      returning nothing are structurally absent, so every rate is biased toward
      success. No amount of analysis fixes this; only collection does.
    prerequisite: A-RD-008 (done) -- now rate-bound, not capability-bound
    rate: >
      The night cycle writes ONE decision per eligible acquisition family, and
      cadence gating left 2 of 3 eligible on 2026-08-09. At ~2 per night, the
      100-decision gate is ~50 cycles away. Raising the count by logging a
      decision per (family, subject) would be inventing choices the cycle never
      made: it picks families, not subjects. The honest levers are more
      families or a finer real decision point, both of which are their own
      nodes.
    invalid_workaround: >
      Do not evaluate a policy on reconstructed rows and report it as a policy
      result. A-RD-005 exists to make that mixing impossible.

  - id: BLK-NO-OBSERVATION-HISTORY
    class: BLOCKED_DATA
    blocks: [D-REP-002, D-REP-003, D-CAL-001, D-CF-001]
    measured: >
      All 2344 macro_observation rows carry `retrieved_at` inside ONE month,
      2026-08, while `published_at` spans 2024 (488), 2025 (1080) and 2026
      (776). `vintage.freeze` admits 0 rows at 2025-01-01, 2025-06-01 and
      2026-01-01, and 2344 only at 2026-08-09. `leak_surface` — rows that had
      already happened but had not been observed — is 488 / 942 / 1572 at
      those three instants.
    required: >
      a corpus whose observation times are spread across the replay window,
      which the engine produces at roughly one cycle per day going forward
    why: >
      The engine learned every historical figure at once. There is therefore
      no historical T0 at which it knew anything, and a replay formed at one
      would be reasoning from an empty state. This is a property of when the
      corpus was ingested, not of the replay code: the machinery is built,
      tested and leak-proofed against a fixture with a real observation
      spread (tests/test_market_thesis_replay.py, 6 episodes, 5 outcomes
      right, 1 wrong, every verdict UNRESOLVED because the mechanism leg has
      no observable).
    invalid_workaround: >
      Do NOT filter on `published_at` to make episodes appear. That is the
      exact defect D-REP-001 built the wall against, and it is measured: at
      2026-01-01 it would admit 1572 figures nobody had seen, and the replay
      would look entirely healthy while reasoning from the future. If a
      replay suddenly starts producing episodes on the live corpus, check
      that the wall is still reading observation time before believing it.

  - id: BLK-NO-EXPLORATION
    class: BLOCKED_DATA
    blocks: [B-BANDIT-001]
    measured: "logged exploration events = 0; every propensity is 1 or 0"
    required: "a logging policy that randomises within the allowed source set"
    why: >
      Off-policy estimators that assume a randomising logger (IPW and
      relatives) are not merely imprecise here, they are inapplicable. Replay
      over the agreeing subset is what remains, and it is a smaller claim.
    prerequisite: "controlled exploration design, itself gated on A-RD-008"
    invalid_workaround: >
      Do not fit a contextual bandit to satisfy a checklist and report an
      offline improvement the logs cannot support. Report UNMEASURABLE.

  - id: BLK-DEMAND-CORPUS
    class: BLOCKED_DATA
    blocks: [E-DEM-002, F-ORD-002]
    measured: "21 / 260 company-demand state cells; 15 / 26 companies with any state"
    required: "multiple measured stages on at least one company for a chain"
    why: >
      The nine-state demand vocabulary works. The corpus is thin: press
      releases do not carry bookings, RPO or backlog. This is a source-coverage
      problem, addressed by targeted extraction (E-DEM-001), not by loosening
      the extractor.
    prerequisite: E-DEM-001
    invalid_workaround: >
      Do not flatten contradictory or missing stages into "demand strong".

  - id: BLK-SUPPLIER-EVIDENCE
    class: BLOCKED_DATA
    blocks: [F-ORD-002]
    measured: "named supplier relationships = 0"
    required: ">= 1 established supplier edge to mediate a third-order path"
    why: >
      A third-order consequence needs a real mediator. Without a named supplier
      the path is a story.
    invalid_workaround: >
      Do not let an LLM complete the chain. Report BLOCKED/MISSING.
