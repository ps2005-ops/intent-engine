  - id: H-SELF-001
    program: H
    title: Self-improvement loop that answers the twelve questions or says it cannot
    dependencies: [H-LA-001]
    priority: 2
    expected_value: >
      The twelve questions in section 36 are the specification for whether this
      system is learning. A channel that cannot answer its question is
      incomplete, and saying so is the finding.
    acceptance_criteria:
      - each of the twelve questions has a named producer and an answer or an
        explicit CANNOT_ANSWER with the missing input
      - the loop runs inside the cycle and its output is persisted
      - a question whose answer is always the same is flagged as a metric that
        cannot report a negative
    tests: tests/test_market_self_improvement.py
    minimum_data: none
    vertical:
      producer: intent_engine.market.self_improvement.review
      persistence: self_review rows per cycle
      reload: review reloads and is comparable across cycles
      consumer: the cycle report and the next cycle's research policy
      surface: the report's closing block
      telemetry: questions answered vs CANNOT_ANSWER
      failure_states: ANSWERED, CANNOT_ANSWER, DEGENERATE_ANSWER
      live_proof: a cycle report with at least one honest CANNOT_ANSWER
      adversarial_proof: a question whose answer never varies must be flagged
      mutation_target: the degenerate-answer detector

  - id: H-CAL-001
    program: H
    title: Decision quality calibration over declared expectations
    dependencies: [E-OUT-001]
    priority: 3
    expected_value: >
      Calibration measured over outcomes rewards luck. Measured over declared
