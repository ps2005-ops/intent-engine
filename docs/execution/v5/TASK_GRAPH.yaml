    program: B
    status: COMPLETE
    verification: CAPABILITY_VERIFIED
    completion_evidence: >
      1d84cee, merged at aff8888 — T0 wall refusing out loud with a counted reason vocabulary; 554 lines of tests including the assertion that published_at is never substituted for retrieved_at. The corpus file does not exist in the live runtime yet, so historical_decision_episodes reads UNMEASURED rather than 0 and B-RM-001 stays blocked — which is the gate working.
    title: Vintage-walled historical decision corpus with a T0 knowledge snapshot
    dependencies: []
    priority: 1
    expected_value: >
      The prospective gates need 100 decisions and stand at 32, rising at the
      rate the world produces them. Historical episodes cannot substitute, but
