# I. Monthly promotion review — PREPARE a human-review packet only.
# Promotion of any candidate remains a human action; this job never promotes.
name: monthly-promotion-review

on:
  schedule:
    - cron: "23 6 1 * *"      # 1st of each month
  workflow_dispatch:
    inputs:
      as_of:
        description: "Override date (YYYY-MM-DD); blank = today (NY)"
        required: false

concurrency:
  group: monthly-promotion-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  call:
    uses: ./.github/workflows/_hosted-job.yml
    secrets: inherit
    with:
      job: monthly-promotion-review
      as_of: ${{ github.event.inputs.as_of }}
      timeout_minutes: 20
