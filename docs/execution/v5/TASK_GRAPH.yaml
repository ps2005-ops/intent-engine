        source and an issued_at, and cannot be constructed from a bare string
      - there is no from_evidence constructor and a test asserts none exists by
        inspecting the class, not by grepping prose
      - every security-sensitive seam takes a TenantScope, and a guard fails
        the suite if a bare string reaches one
      - scope establishment is recorded and auditable
    tests: tests/test_tenant_scope.py
    minimum_data: none
    vertical:
      producer: intent_engine.core.tenant.TenantScope.establish
      persistence: scope establishment audit rows
      reload: a persisted scope reloads only with its establishment source
      consumer: D-IBG-001, D-SYN-001, E-ACT-001, E-PFA-001, F-BAR-001, F-AT-001
      surface: provenance drawer permission source line
      telemetry: scopes established by source, refusals
      failure_states: NO_ESTABLISHMENT_SOURCE, STRING_REFUSED, EXPIRED
      live_proof: a request served under an established scope with an audit row
      adversarial_proof: confused deputy, id collision, alias collision, cache
        collision, path collision and export collision, each asserted
      mutation_target: the string-refusal constructor guard

  - id: F-BAR-001
    program: F
    title: Information barrier — four typed trust zones in every context builder
    dependencies: [F-TS-001]
    priority: 1
    expected_value: >
      PUBLIC_EXTERNAL, TENANT_PRIVATE, SYSTEM_INTERNAL and SYNTHETIC are
      different kinds of fact with different authority. Today they are all
      strings in a prompt. The barrier is what makes "external data can never
      acquire instruction authority" a property rather than a hope.
    repository: founder
    acceptance_criteria:
      - every model context builder takes typed zones, not concatenated text
      - PUBLIC_EXTERNAL content can never be placed where instructions are read
      - private content never crosses a tenant boundary, enforced at the
        builder rather than at the caller
      - a zone mismatch raises rather than downgrading
    tests: tests/test_information_barrier.py
    minimum_data: none
    vertical:
      producer: intent_engine.core.trust_zone context builders
      persistence: zone tag on every context fragment record
      reload: fragments reload with zones; an untagged fragment refuses
      consumer: every LLM call site
      surface: provenance drawer zone line
      telemetry: fragments by zone per call
      failure_states: ZONE_MISMATCH, UNTAGGED_FRAGMENT, CROSS_TENANT_REFUSED
      live_proof: a real call whose fragments are all zone-tagged
      adversarial_proof: F-INJ-001 battery
      mutation_target: the instruction-authority predicate

  - id: F-INJ-001
    program: F
    title: Prompt-injection firewall over external content, with audited refusals
    dependencies: [F-BAR-001]
    priority: 1
    expected_value: >
      The engine reads filings, sites and news and feeds them to a model. Any
      of those can contain text addressed to the model. The firewall is the
      difference between reading a document and executing it.
    repository: founder
    acceptance_criteria:
      - external content is sanitised and marked as data before any model sees it
      - detected instruction attempts are refused, counted and persisted with
        the offending span, not silently stripped
      - a refusal never discards the underlying evidence
      - detection is tested against direct, encoded and indirect payloads
    tests: tests/test_injection_firewall.py
    minimum_data: none
    vertical:
      producer: intent_engine.core.sanitation.screen
      persistence: injection_refusal rows with the span
      reload: refusals reload for audit
      consumer: F-BAR-001 builders and every ingestion path
      surface: source health block, injection attempts line
      telemetry: attempts by payload class
      failure_states: CLEAN, INSTRUCTION_DETECTED, ENCODED_PAYLOAD,
        INDIRECT_REFERENCE
      live_proof: a real ingestion run with the counter present and reporting
        a legitimate zero alongside a seeded positive control
      adversarial_proof: direct, encoded and indirect payloads each detected
      mutation_target: the detection predicate

  - id: F-AT-001
    program: F
    title: Antitrust air-gap — one tenant's nonpublic strategy never advises a rival
    dependencies: [F-TS-001, D-IBG-001]
    priority: 1
    expected_value: >
      A multi-tenant advisor that sees two competitors' private plans is one
      query away from facilitating coordination. Public information stays
      usable; the gap is on nonpublic information and on the specific advice
      classes that constitute coordination.
    repository: founder
    acceptance_criteria:
      - private information about tenant A can never influence tenant B's
        pricing, market allocation, bidding, discounting, capacity or
        competitor-response model
      - coordinated pricing, market division, bid coordination and
        strategy-transfer requests are refused explicitly by class
      - refusals are persisted and audited with the requesting scope
      - public information remains usable and a test proves the gap does not
        block it
    tests: tests/test_antitrust_airgap.py
    minimum_data: none
    vertical:
      producer: intent_engine.core.airgap.screen_advice
      persistence: airgap_refusal rows with class and scope
      reload: refusal history reloads for audit
      consumer: every advice-producing surface
      surface: refusal shown to the asker with the reason class
      telemetry: refusals by class and tenant pair
      failure_states: ALLOWED, COORDINATION_REFUSED, PRIVATE_LEAK_REFUSED
      live_proof: an audited refusal from a real request path
      adversarial_proof: a cross-tenant strategy-transfer probe must refuse and
        a public-information question must still succeed
      mutation_target: the nonpublic-influence check

  # ---- PROGRAM G: EXECUTIVE EXPERIENCE ----------------------------------

  - id: G-XRAY-001
    program: G
    title: Executive Decision X-Ray as a view over canonical state
    dependencies: [E-LDR-001, A-ASSUME-001, C-LK-001]
    priority: 1
    expected_value: >
      Every surface this system has shipped that reasoned for itself has
      eventually disagreed with the decision it was presenting. The X-Ray is
      the answer: one screen, thirteen blocks, and no independent reasoning.
    repository: founder
    acceptance_criteria:
      - the view reads one decision object and renders DECISION, WHAT CHANGED,
        WHY, ECONOMIC MECHANISM, INTERNAL IMPACT, STRONGEST ALTERNATIVE,
        ADVERSARIAL FAILURE PATH, SCENARIOS, FALSIFIER, KILL SWITCH, MISSING
        INFORMATION, PROVENANCE and DECISION IMPACT
      - a test asserts the view performs no inference — given a fixed decision
        object it produces identical output with the reasoning layer removed
      - every block defines its empty state and no block renders a hypothesis
        as the decision
    tests: tests/test_executive_xray.py
    minimum_data: none
    vertical:
      producer: intent_engine.founder_intelligence.xray.render
      persistence: none of its own; it is a projection
      reload: renders identically from a reloaded decision record
      consumer: the Founder web surface and the deep documents
      surface: itself, the single executive screen
      telemetry: blocks rendered empty per view
      failure_states: per-block empty states, DECISION_MISSING
      live_proof: the deployed page rendering a real decision
      adversarial_proof: a test that removing the reasoning layer changes
        nothing, and that hypotheses[0] is never read as the decision
      mutation_target: the decision-object read path

  - id: G-PROV-001
    program: G
    title: Provenance drawer — every statement traceable to a source and a known_at
    dependencies: [G-XRAY-001, F-BAR-001]
    priority: 2
    expected_value: >
      An executive claim without a chain to a source and a date is not
      auditable, and the first time one is wrong the whole surface loses
      standing. Private facts additionally need the scope and the permission
      that allowed them.
    repository: founder
    acceptance_criteria:
      - the chain is statement to decision node to mechanism to KnowledgeEffect
        to evidence to source to known_at
      - private facts add tenant scope and permission source
      - a statement with a broken chain is rendered as unsupported rather than
        hidden
    tests: tests/test_provenance_drawer.py
    minimum_data: none
    vertical:
      producer: intent_engine.founder_intelligence.provenance.chain
      persistence: none; derived from existing links
      reload: chain rebuilt from reloaded records
      consumer: the X-Ray PROVENANCE block
      surface: an expandable drawer per statement
      telemetry: statements with complete vs broken chains
      failure_states: COMPLETE, BROKEN_AT_<stage>, PRIVATE_NO_PERMISSION
      live_proof: a real statement traced end to end on the deployed page
      adversarial_proof: a private fact without a permission source must render
        as unsupported
      mutation_target: the chain completeness check

  - id: G-DEG-001
    program: G
    title: Source degradation and progressive cold start, distinguished from silence
    dependencies: []
    priority: 2
    expected_value: >
      SOURCE_DEGRADED is not NO_ACTIVITY and an empty first run is not an empty
      world. Both have already produced false all-clears in this system. This
      node makes the distinction structural and makes the first minutes of a
      new tenant useful rather than blank.
    repository: founder
    acceptance_criteria:
      - a degraded source is reported as degraded at every surface that would
        otherwise report zero
      - cold start hydrates in stages and each stage states what is not yet known
      - a failed fetch never renders as an absence of activity
    tests: tests/test_source_degradation.py
    minimum_data: none
    vertical:
      producer: intent_engine.founder_intelligence.hydration.stage
      persistence: source_health and hydration_stage rows
      reload: degradation state reloads with its cause
      consumer: every zero-rendering surface
      surface: a banner distinguishing degraded from empty
      telemetry: surfaces rendering zero by cause
      failure_states: HEALTHY, DEGRADED, UNAVAILABLE, COLD
      live_proof: a run with one source degraded and the banner present
      adversarial_proof: a forced fetch failure must not render as no activity
      mutation_target: the zero-vs-degraded branch

