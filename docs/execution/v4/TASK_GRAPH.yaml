    minimum_data: none

  - id: H-IMP-001
    program: H
    title: Founder DecisionImpact, real company first
    dependencies: [H-CON-001]
    status: WAITING_DEPENDENCY
    priority: 4
    acceptance_criteria:
      - deterministic Founder-without-V4 vs Founder-with-V4 on the same company
      - scored NONE / PRESENTATIONAL / MEANINGFUL / DECISION_CHANGING
      - a NONE result is recorded as NONE, and the missing evidence identified
    minimum_data: none

  - id: I-ACC-001
    program: I
    title: Learning acceleration recomputed from KnowledgeEffect
    dependencies: [A-RD-008]
    status: WAITING_DEPENDENCY
    priority: 3
    acceptance_criteria:
      - rolling windows from effects rather than accepted rows
      - ECONOMIC / SYSTEM / CALIBRATION / FOUNDER / RETENTION / RESEARCH /
        UNSUPERVISED classified independently
    minimum_data: none

  - id: I-STA-001
    program: I
    title: Stagnation detection
    dependencies: [I-ACC-001]
    status: WAITING_DEPENDENCY
    priority: 4
    acceptance_criteria:
      - alerts on high evidence + low effect rate; high thesis count + low
        resolution; high cost + low realized VOI; many discoveries + low
        validation; many Founder analyses + zero DecisionImpact
    minimum_data: none

  # ---- PROGRAM J: ROBUSTNESS --------------------------------------------

  - id: J-BRK-001
    program: J
    title: Break proofs for the new research-observability guards
    dependencies: [A-RD-007]
    status: WAITING_DEPENDENCY
    priority: 2
    expected_value: >
      Guards that have never been shown to fail are guards nobody has tested.
      Session 3 found 4 of 21 mutations NOT_CAUGHT, each naming a real
      unasserted guard.
    acceptance_criteria:
      - mutations cover prospective logging removed; NO_RESULT rows dropped;
        choice set absent; fake propensity accepted; delayed reward applied
        immediately; expected VOI copied into realized reward
      - each must go RED for the intended reason
      - mutation lock held; restore verified by hash; mtime bumped so CPython
        does not run stale bytecode
    minimum_data: none

  - id: J-ADV-001
    program: J
    title: Adversarial suite extension
    dependencies: [A-RD-008]
    status: WAITING_DEPENDENCY
    priority: 3
    acceptance_criteria:
      - retains all 27 prior attacks
      - adds no-result omitted; choice set reconstructed after outcome;
        propensity invented; volume hack; high-cost low-value source;
        easy-source confirmation bias; KnowledgeEffect assigned to an unrelated
        hypothesis; synthetic/live mixing; trade P&L validating a mechanism
    minimum_data: none

  # ---- PROGRAM K: LIVE VALIDATION ---------------------------------------

  - id: K-CYC-001
    program: K
    title: Verify V4 projections actually reach a run report
    dependencies: []
    status: COMPLETE
    priority: 1
    expected_value: >
      Reconciliation finding 2026-08-09: no cycle has ever run with the V4
      projections in place. report.py gained research_policy at 3eb24d2
      (21:31); the last night report was written at 20:28. The session-3 claim
      that the research log reads reconstructed:0 came from an in-process
      probe, not from a cycle. This is the "committed is not deployed" pattern.
    acceptance_criteria:
      - a cycle is run at this SHA and the written report contains
        research_policy, knowledge_effects, economic_thesis, unsupervised
      - any key still missing is diagnosed rather than reported as present
    minimum_data: none
    completion_evidence: "2026-08-09_night.json contains research_policy, knowledge_effects, economic_thesis, unsupervised, founder_v4, demand_chain, economic_quantities, presentation. research_policy reads log_size 321 reconstructed 0, which confirms the session-3 figure that previously had no artifact behind it."

  - id: K-CYC-002
    program: K
    title: Verify source_preference and research_decisions reach a report
    dependencies: []
    status: READY
    priority: 1
    expected_value: >
      The 2026-08-09 cycle emitted both keys EMPTY, because the run started
      before 431538b and the process had already imported the older module.
      This is the same staleness that K-CYC-001 was opened for, caught this
      time by its own guard rather than reported as success. A cycle at
      431538b or later settles it.
    acceptance_criteria:
      - a cycle is run at >= 431538b and the written report carries a non-empty
        knowledge.research_decisions and knowledge.source_preference
      - the decision count in the report equals what a fresh process reads from
        the ledger
    tests: null
    minimum_data: none
    completion_evidence: null
