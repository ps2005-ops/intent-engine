<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Executive report preview</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:820px;
margin:0 auto;padding:2rem;color:#1a1a2e;line-height:1.55}
h1{font-size:1.9rem}h3{margin-top:2.2rem;border-bottom:1px solid #e6e6ef;
padding-bottom:.3rem}.card{border:1px solid #e6e6ef;border-radius:10px;
padding:1rem 1.2rem;margin:.8rem 0;background:#fff}
.state{font-size:.85rem;color:#555}.why{color:#333}.alt,.q{font-size:.9rem;
color:#444}.limitation{font-size:.85rem;color:#666}
.unavailable{color:#666;font-style:italic}
details summary{cursor:pointer;font-size:.85rem;color:#3a3a8c}
code{background:#f4f4fa;padding:.05rem .3rem;border-radius:4px;font-size:.8rem}
.avail-conflicted{border-left:3px solid #b8860b}
.avail-stale{border-left:3px solid #999}
.trust-note{background:#f6f8ff;border-radius:10px;padding:1rem;font-size:.9rem}
/* --- shared product shell (nav, forms, controls, lifecycle states) --------- */
nav{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center;font-size:.85rem;
background:#f6f8ff;border:1px solid #e6e6ef;border-radius:10px;padding:.55rem .9rem;
margin-bottom:1.6rem;color:#555}
nav a{color:#3a3a8c;text-decoration:none}nav a:hover{text-decoration:underline}
nav form{display:inline;margin:0}
nav button{background:transparent;color:#3a3a8c;border:0;padding:.1rem .2rem;
font:inherit;font-weight:500;cursor:pointer;text-decoration:underline}
nav button:hover{color:#2d2d70}
/* On a phone every nav item is a thumb target, and at the shell's 0.85rem
   they were 18-20px tall -- under the 24px minimum, on the control a reader
   uses to get out of a page. Desktop is unchanged: the extra height comes
   from padding that only applies where pointing is imprecise. */
@media (max-width:600px){
nav{gap:.35rem .9rem;padding:.5rem .8rem}
nav a,nav button{display:inline-flex;align-items:center;min-height:44px;
padding:.1rem .15rem}}
label{display:block;margin:.4rem 0 .3rem;font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=url],
input:not([type]),textarea,select{width:100%;max-width:34rem;box-sizing:border-box;
/* #cfd0dc was 1.53:1 on the white field — the same WCAG 1.4.11 defect the
   landing sheet had at #d5d5e2, but in the SHARED shell, so it reached every
   form outside the landing page: login, the follow-up question box on a
   result, the add-a-source form. Found on the deployed Palantir result at
   485ec4b, in light mode, after the landing fix had already shipped —
   fixing one sheet says nothing about the other. #888aa4 is 3.38:1,
   alongside the landing's 3.42:1. */
padding:.55rem .7rem;border:1px solid #888aa4;border-radius:8px;font:inherit;
background:#fff;color:inherit}
textarea{min-height:6rem;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid #6b6be0;
outline-offset:1px;border-color:#6b6be0}
input[type=checkbox]{width:auto;margin-right:.5rem;vertical-align:baseline}
button{background:#3a3a8c;color:#fff;border:0;border-radius:8px;padding:.6rem 1.15rem;
font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#2d2d70}
button:disabled{background:#b9b9d4;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:1.2rem 0}
[role=alert]{background:#fff4f4;border:1px solid #f0c9c9;color:#8a1f1f;
border-radius:8px;padding:.7rem .9rem;margin:1rem 0}
[role=status]{background:#f0f6ff;border:1px solid #cfe0f5;border-radius:8px;
padding:.7rem .9rem;margin:1rem 0}
/* AN ANNOUNCEMENT WITH NOTHING TO ANNOUNCE DRAWS NOTHING.
   The autocomplete's live region is a [role=status] and inherits this panel,
   so on the company-entry screen an empty 38px tinted box sat directly under
   the only input on the page — reading as a second, broken field. Measured
   locally at 390px.
   It stays in the DOM rather than being display:none'd, because a live region
   removed from the box tree is one assistive technology may stop watching;
   this only stops it PAINTING until it has something to say. */
[role=status]:empty,[role=alert]:empty{background:none;border:0;padding:0;
margin:0}
.coverage{background:#fffaf0;border:1px solid #f0e0c0;border-radius:8px;
padding:.7rem .9rem;margin:1rem 0}
details{border:1px solid #e6e6ef;border-radius:10px;padding:.6rem .9rem;
margin:1.2rem 0;background:#fafaff}
details>summary{cursor:pointer;font-weight:600;color:#3a3a8c}
ul.source-list{list-style:none;padding:0;margin:.3rem 0 1.2rem}
ul.source-list li{margin:.35rem 0}
ul.source-list li label{display:block;font-weight:400;border:1px solid #e6e6ef;
border-radius:8px;padding:.55rem .7rem;background:#fff;cursor:pointer;line-height:1.4}
ul.source-list li label:hover{border-color:#c3c3e6;background:#fbfbff}
ul.source-list .tag{display:inline-block;font-size:.72rem;font-weight:600;
border-radius:999px;padding:.05rem .5rem;margin-left:.35rem;vertical-align:middle}
.tag-authoritative{background:#e7f6ec;color:#1c6b3a}
.tag-external{background:#f3eefc;color:#5b3aa0}
.tag-unverified{background:#f4f4f4;color:#666}
.stage{font-size:1rem;margin:1rem 0}
.step-badge{display:inline-block;background:#eeeefc;border-radius:999px;
padding:.15rem .75rem;font-size:.85rem;font-weight:600;color:#2d2d70}
.count-note{font-size:.85rem;color:#555}
/* PANELS THAT SET A LIGHT BACKGROUND AND NO COLOUR. Under a dark scheme the
   background stayed light while the text inherited the dark scheme's
   near-white, so each of these rendered white-on-white. Measured live on
   preview-v3 at 20ffb9c, on the PROGRESS page — the screen every visitor
   watches for the whole analysis: the stage line "Writing the founder
   briefing." inside [role=status] at 1.01:1, and the .coverage note "This
   preview stores runs in memory..." at 1.06:1. Both invisible.

   The generic floor in `webapp.app._A11Y_CSS` covers .card/.chip/details and
   could not reach these: it has no rule for [role=status], [role=alert],
   .coverage or a source-list label. Give each a dark counterpart here, beside
   the light one it corrects, so the two cannot drift apart. */
@media (prefers-color-scheme:dark){
[role=alert]{background:#2a1717;border-color:#5b2b2b;color:#ffb4b4}
[role=status]{background:#161c26;border-color:#3a4454;color:#f3f4f6}
/* Restated inside the dark block: these two rules have the same specificity
   as the :empty reset above and land after it, so without this the empty
   announcement box comes back in dark only — exactly the asymmetry this
   file's own dark audit was written to stop. */
[role=status]:empty,[role=alert]:empty{background:none;border:0;padding:0;
margin:0}
.coverage{background:#1f1b12;border-color:#4a3f28;color:#f3f4f6}
details{background:#161c26;border-color:#3a4454}
ul.source-list li label{background:#1b2230;border-color:#3a4454;color:#f3f4f6}
ul.source-list li label:hover{background:#222b3b;border-color:#4a5568}
.tag-authoritative{background:#14351f;color:#8fe0ac}
.tag-external{background:#241a3a;color:#c4a9f5}
.tag-unverified{background:#22262e;color:#c3cad6}
.step-badge{background:#1e2440;color:#c9cdff}
.count-note{color:#c3cad6}}
</style>
<style>
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{
outline:3px solid #1d4ed8;outline-offset:2px}
img,svg,video,table{max-width:100%}
pre,code{overflow-x:auto;max-width:100%}
@media (max-width:600px){
body{font-size:16px}
main{padding-left:14px;padding-right:14px}
table{display:block;overflow-x:auto}}
@media (prefers-color-scheme:dark){
:root{color-scheme:dark}
body{background:#0f141c;color:#f3f4f6}
a{color:#7aa2ff}
/* The focus ring is set once above in the light accent (#1d4ed8), and that
   colour carried into dark mode unchanged: measured on the deployed /login at
   b66dbe3, 2.76:1 against #0f141c, under the 3:1 WCAG floor for a non-text UI
   indicator. A keyboard user in dark mode could not reliably see where they
   were. `.brief` and `.deck` were already correct because their ring reads
   var(--accent), which IS re-pointed below; only the global floor hard-coded
   the literal. Same specificity as the base rule, so it wins on order. */
:where(a,button,input,select,textarea,summary,[tabindex]):focus-visible{
outline-color:#7aa2ff}
:where(h1,h2,h3,h4,h5,h6){color:#f3f4f6}
/* NOT :where() — that zeroes specificity, so these lost to the very class
   rules they correct and the panels stayed light under a dark scheme. */
:root .card,:root .chip,:root .agenda,:root details,
:root fieldset{background:#161c26;border-color:#3a4454}
:root .muted,:root .state,:root .limitation,:root small{color:#c3cad6}
/* Components that define their own palette as custom properties (.brief and
   .deck) kept LIGHT values in dark mode: the body went near-black while
   var(--panel) stayed #f8fafc and var(--ink) stayed near-white, so the layer
   nav rendered near-white text on a near-white bar at 1.04:1 — the tab you
   were on was invisible. Re-point the variables rather than restyle
   everything that uses them.

   Two things here are load-bearing and easy to undo by accident:

   1. The :root prefix. .brief and .deck ship their CSS in the BODY, which
      lands after this stylesheet, so a bare `.deck` selector loses the
      cascade to the very rule it is correcting. :root outranks it.
   2. The absence of :where(). :where() zeroes specificity, so those rules
      would lose to any plain class selector — including all of these. */
:root .brief,:root .deck{--ink:#f3f4f6;--muted:#c3cad6;--line:#3a4454;
--ctl:#606e88;--bg:#0f141c;--panel:#161c26;--accent:#7aa2ff;--accent-ink:#0f141c}
:root nav,:root .trust-note,:root .panel{background:#161c26;
border-color:#3a4454;color:#c3cad6}
:root nav a,:root nav a:visited,:root nav button,
:root details summary{color:#7aa2ff}
:root code,:root pre{background:#1b2230;color:#e5e7eb}
/* Buttons keep a white background from the base sheet; inheriting the dark
   scheme's near-white text on it renders them at 1.1:1 — unreadable. */
/* A CONTROL'S EDGE IS NOT DECORATION. WCAG 1.4.11 asks 3:1 for the boundary
   that tells a reader where a field IS, and #3a4454 renders at 1.88:1 on
   #0f141c and 1.74:1 on a panel — measured live on the deployed landing form
   at a5e1322, where the text and placeholders passed and the boxes around
   them did not. #606e88 is 3.59:1 on the page, 3.32:1 on a panel and 3.10:1
   inside the field. Panel and separator borders stay #3a4454: those are
   decorative, and this rule is only for things you click into. */
:root button,:root input,:root select,:root textarea{background:#1b2230;
color:#f3f4f6;border-color:#606e88}
/* A BORDER-COLOUR WITH NO WIDTH DRAWS NOTHING. The rule above names #606e88
   and stops there, but the base sheet ships a global `button{border:0}`
   (presentation._BASE_CSS) that zeroes the WIDTH, so on every <button> that
   colour had nothing to paint. Measured live on preview-v3 at 81ac65d, in
   dark mode: the landing page's anonymous-entry CTA rendered #1b2230 on
   #0f141c — 1.16:1 — a control a reader can read the label of and cannot see
   the edges of. The inputs passed only because the landing sheet happens to
   set its own 1px width.

   (Phrased without quoting that button's copy on purpose: this stylesheet is
   inlined into every page, comments included, so a label quoted here would
   appear on pages the control itself is switched off for.)

   Checkboxes and radios are excluded on purpose: `:root{color-scheme:dark}`
   above already hands them a native dark boundary, and giving them an author
   border makes the engine drop that native rendering — trading a boundary
   that works for one that also loses the tick. */
:root button,:root input:not([type=checkbox]):not([type=radio]),
:root select,:root textarea{border-style:solid;border-width:1px}
/* ...but a text-styled control is not a box. `nav button` (Log out, Leave
   demo) and `button.linkish` (the example runs) set a transparent background
   deliberately so they read as links beside their real <a> siblings. The
   blanket fill above outranks them, so in dark each one became a flat
   #1b2230 rectangle at 1.16:1 — no longer a link, not yet a visible button.
   Give the transparency back and keep the edge off. Both selectors outrank
   the two rules above, so this holds wherever it lands in the cascade. */
:root nav button,:root button.linkish{background:transparent;border-width:0}
/* ...and a PRIMARY action is not a box either. The blanket fill above outranks
   the landing sheet's accent (both are one class + one element, and this sheet
   is injected second), so in dark every primary submit rendered #1b2230 — the
   same flat panel as a text input. Measured locally at 390px in dark: the
   first screen's dominant control and an inert field were the same colour,
   which is the whole hierarchy of that screen erased.
   Two selectors' worth of specificity, so it holds regardless of order, and it
   re-points to the same accent pair the dark palette already defines rather
   than inventing a third blue. */
:root button.primary,:root form.analyze button[type=submit]{
background:#7aa2ff;color:#0f141c;border-width:0}
:root .why,:root .alt,:root .q,:root .unavailable,:root .state,
:root .limitation,:root .muted,:root .when{color:#c3cad6}
/* Deck surfaces that hard-code a light literal rather than var(--panel), and
   so survived the variable re-pointing above: the citations drawer (#fafaff)
   and the slide action buttons (white). Both need a selector at least as
   specific as the deck's own. */
:root .deck .cites,:root details.cites{background:#161c26;
border-color:#3a4454}
:root .deck .act button,:root .deck .act a,:root .deck .nav a,
:root .deck button{background:#1b2230;color:#f3f4f6;border-color:#3a4454}
/* The full-analysis document (.si) carries its OWN dark palette, defined
   beside its own stylesheet in the strategic-intelligence renderer. Do not
   add .si rules here: overriding that palette from outside fights it instead
   of completing it, and measurably makes contrast worse. */}
@media print{
nav,form,.actions,.b-act,.layers{display:none!important}
body{background:#fff;color:#000}}
</style>
