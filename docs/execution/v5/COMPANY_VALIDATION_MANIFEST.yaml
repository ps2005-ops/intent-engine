contract: company_validation_manifest.v1
manifest_version: 1.0.1
created_at: '2026-08-11'
governing_plan_version: V5_BATCH_9
total_active: 100
known_limitations:
- id: COVERAGE_EXPECTATION_IS_NEARLY_CONSTANT
  detail: >-
    92 of 100 entries carry coverage_expectation HIGH_COVERAGE, because 90 of
    them are listed North American companies that file with a regulator and
    run an investor-relations site. That is an accurate description of the
    universe, but it makes the field nearly useless as a STRATIFICATION axis
    (§15) - stratifying on it separates 92 from 8. Written down rather than
    quietly relabelled, because inventing a spread would be exactly the
    inference §12 forbids.
  consequence: >-
    Waves larger than ten should stratify on sparse_or_withheld,
    identity_difficulty, public_private and sector, not on
    coverage_expectation. Revisit before the 30-company wave.
- id: PRIVATE_REPRESENTATION_IS_THIN
  detail: >-
    10 private entries and 7 sparse-or-withheld. Enough for the breaker ten,
    which takes two private companies including one withheld, but thin for
    the later waves that are supposed to break the private and bounded paths.
  consequence: >-
    A v1.1 revision should add private and bounded companies rather than
    reweight the existing ones; adding entries is a recorded change, and
    silently moving a cohort is not.
cohort_targets:
  DEVELOPMENT: 60
  REGRESSION: 20
  BLIND_HOLDOUT: 20
cohort_rule: Sort all active entries by (sector, company_id) and cycle DEVELOPMENT,
  DEVELOPMENT, DEVELOPMENT, REGRESSION, BLIND_HOLDOUT. Sorting by sector first guarantees
  every sector is spread across all three cohorts, so no cohort can accumulate a
  single archetype; 100 entries over a 5-cycle lands exactly on 60/20/20. Deterministic
  and re-derivable from these fields alone -- a test recomputes it and fails if
  the stored cohorts drift.
not_an_answer_key: This manifest records WHY a company is useful to test. It must
  never record an expected recommendation, thesis, causal effect, confidence or
  adversary output.
change_history:
- manifest_version: 1.0.1
  at: '2026-08-14'
  change: >-
    stripe business_model_class corrected SUBSCRIPTION_SOFTWARE ->
    BALANCE_SHEET_OR_NETWORK. A payment network earns a take rate on
    intermediated volume, which is how visa and mastercard are already
    classified here; the old value made the executive read describe
    subscription revenue Stripe does not have. Sector left unchanged because
    cohorts derive from it.
  companies_added: 0
  companies_removed: 0
  cohort_moves: 0
