axes:
  LEARNING_ACCELERATION:
    status: PARTIAL
    note: still computed from accepted rows, not effects (I-ACC-001)
  SOURCE_HEALTH:
    status: PASS
    note: 'L-SRC-001, live at 8f14906. Source health is a persisted state per family per cycle with streak
      and last_success, not a line in one report. A degraded source raises uncertainty and never weakens
      the claim, proven by mutation. An unrecognised failure is UNCLASSIFIED with its message kept rather
      than mapped onto the nearest known state. BLS has been 503 on every recorded cycle and is now visible
      as a state. Staleness from expected cadence is recorded NOT_BUILT: nothing reads the field.

      '
  ADVERSARY_ENGINE:
    status: PASS
    note: 'L-ADV-001, built and CONNECTED in steps.py beside the deck, so the object reaches a run report
      rather than sitting in a module with no caller. Four response standings and one rule: a response
      may not exceed HYPOTHESIZED_RESPONSE unless evidence names the means, the motive or the act. from_rival_existence
      is a named constructor that raises. Nothing is composed — the production constructor reads the thesis''s
      own alternatives, and the early warnings are its falsifiers. PASS is about the OBJECT and its guards;
      every live case is SPECULATIVE and says so, because the corpus carries no evidence of a counterparty''s
      means or motive. 31 tests, 12/12 break proofs.

      '
  COLD_START:
    status: V4_EXTERNAL_PENDING
    note: 'L-CLD-001, READY, recorded against the FOUNDER repository because hydration and the decision
      surface live there. The invariant to verify: no prior or sector default is ever rendered in the
      same voice as an observation.

      '
  EXTERNAL_DATA_SANITATION:
    status: PASS
    note: 'L-SAN-001, scoped by measurement. A tokenised AST guard fails on any model-client import or
      call in src/intent_engine/market/ outside a declared-boundary allowlist, which is empty because
      no such call exists; it reads the syntax tree because this package discusses LLM proposals in prose
      and a grep would flag three innocent modules. Four injection payloads through the real translator:
      none becomes evidence. PASS is bounded to this branch — the FOUNDER obligation is a recorded cross-repo
      prerequisite, asserted by a test so a passing suite cannot be read as closing it.

      '
  INFORMATION_BARRIER:
    status: PARTIAL
    note: 'REASON CORRECTED. Previously V4_INTERNAL_REQUIRED on the grounds that no internal Business
      Graph exists here; market/internal_state.py does exist and enforces a per-company permission wall
      in code — readable() filters by company_id, refuses an unnamed reader rather than serving everything,
      and there is deliberately no aggregate. What is absent is any PRODUCTION CALLER: it is imported
      by three test modules and nothing under src/. Implemented is not instrumented. The verifiable part
      is verified (7 tests) and guarded: any future importer must go through readable(), and a test fails
      the day a caller appears so this axis gets re-scored. Taint tracking, tenant-scoped retrieval, egress
      control and prompt-assembly separation remain V4-I9.

      '
  ANTITRUST_AIR_GAP:
    status: PARTIAL
    note: 'REASON SHARPENED. ''Single-tenant by construction'' was too strong: the tenant unit here is
      the COMPANY, and internal_state already scopes to one and refuses to cross. The three checkable
      cross-tenant claims are checked — one company''s facts are not readable for another, an unnamed
      reader is refused, and no aggregate function exists. Retrieval-key, cache, embedding-store and exported-dossier
      collision, and refusal/audit events for coordination requests, need two live tenants and remain
      V4-I10; action-level competition law remains V5.

      '
  DEMAND_INTELLIGENCE:
    status: PARTIAL
    note: 'E-DEM-001. Subject-, role- and standing-aware extraction at cef65d3. The phrase list it replaces
      scored PRECISION 0.50 on a labelled corpus written before the detector existed; the four questions
      — object, standing, subject, role — score 1.00/1.00 with refusal reasons that agree with the labels.
      End to end on a real filing: "Strong order rates and a growing backlog reflect broadening momentum"
      becomes a DEMAND_SIGNAL row and reads BACKLOG / UP / OBSERVED. PARTIAL not PASS: the live corpus
      still has ZERO companies for CUSTOMER_INTENT, BOOKINGS, COMMITTED_DEMAND, BACKLOG, CANCELLATIONS
      and SHIPMENTS, so no transmission path can be built — the chain has both ends and no middle. Live
      coverage FELL 23 -> 18 cells because the refusals were correct.

      '
  EVIDENCE_EXTRACTION:
    status: PARTIAL
    note: 'E-DEM-001, repaired at 69a2438. The parser was discarding 79% of every filing: text was buffered
      only inside a block-tag whitelist that had no <div>, and SEC filings write prose in <div>/<font>.
      Measured on Caterpillar Q2 2026: 13,462 -> 33,742 characters, 30 -> 128 candidate sentences, 0 ->
      5 demand sentences. PARTIAL not PASS: the sentences now reach the classifier and the classifier
      still refuses the narrative ones, because no family carries orders, bookings or shipments as an
      object. Coverage in the LEDGER changes only as new cycles ingest — the corpus already written was
      extracted under the old parser and is not rewritten.

      '
