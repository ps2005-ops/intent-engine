      - a missing mediator breaks the path rather than being narrated across
    minimum_data: none

  - id: F-ORD-002
    program: F
    title: Third-order consequences, depth-capped
    dependencies: [F-ORD-001]
    status: WAITING_DEPENDENCY
    priority: 5
    acceptance_criteria:
      - one further mediated step, hard depth cap
      - missing supplier relationship yields BLOCKED/MISSING, never LLM
