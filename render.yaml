# Render Blueprint — single always-on web service with an in-process scheduler.
#
# WHY ONE SERVICE (not separate cron services): Render persistent disks attach
# to exactly ONE service and are never shared. This platform's stores are
# append-only files on that disk, so the scheduled jobs MUST run inside the
# service that owns the disk. The web service runs the schedule in-process
# (intent_engine.runtime.scheduler), gated by SCHEDULER_ENABLED. Every job
# still goes through the JobLock + persistent job events, so scheduling is
# idempotent and restart-safe even if the instance restarts mid-run.
#
# Secrets are NEVER in this file (sync:false = set in the Render dashboard).
# The instance must be always-on (Starter+, not Free) or the scheduler sleeps.

services:
  - type: web
    name: intent-engine-web
    runtime: python
    plan: starter                      # Free sleeps -> the scheduler would not tick
    buildCommand: "pip install -e ."
    startCommand: "python -m intent_engine.webapp runserver --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: WEBAPP_ENV
        value: production
      - key: WEBAPP_SECRET
        sync: false
      - key: WEBAPP_TRUSTED_HOSTS
        sync: false
      - key: RUNTIME_ROOT
        value: /var/data
      - key: SCHEDULER_ENABLED          # turn the in-process scheduler on
        value: "1"
      - key: TIINGO_API_KEY             # market data; jobs fail loudly if unset
        sync: false
      - key: FRED_API_KEY
        sync: false
      # optional: ANTHROPIC_API_KEY (synthetic --live), PUBLER_API_KEY +
      # PUBLISHING_ENABLED (real marketing publish — off by default).
    disk:
      name: intent-engine-data
      mountPath: /var/data              # persistent across deploys; owns every store
      sizeGB: 1

# Scheduling cadence (intent_engine.runtime.scheduler.SCHEDULE), enforced in
# code and market-calendar aware:
#   daily (market days)  -> preflight + market-open + resolve + daily-candidates
#   synthetic-daily      -> offline synthetic gym (every day)
#   weekly-eval          -> walk-forward candidate evaluation (once/ISO week)
#   monthly-packet       -> promotion-review packet (once/calendar month)
#
# Manual/on-demand runs remain available:
#   python -m intent_engine.runtime <job> --root /var/data
