    dependencies: [E-OUT-001]
    priority: 2
    expected_value: >
      learning_acceleration already tracks the external channels. The five new
      ones are where V5's value is created, and a channel nobody measures is a
      channel nobody can tell is stalled.
    acceptance_criteria:
