      '
  SOURCE_HEALTH:
    status: PASS
    note: 'L-SRC-001, live at 8f14906. Source health is a persisted state per family per cycle with streak
      and last_success, not a line in one report. A degraded source raises uncertainty and never weakens
      the claim, proven by mutation. An unrecognised failure is UNCLASSIFIED with its message kept rather
      than mapped onto the nearest known state. BLS has been 503 on every recorded cycle and is now visible
      as a state. Staleness from expected cadence is recorded NOT_BUILT: nothing reads the field.

      '
  ADVERSARY_ENGINE:
    status: PASS
    note: 'L-ADV-001, LIVE at 5d80d21: 48 cases, by_standing {SPECULATIVE 48, GROUNDED 0, DEMONSTRATED
      0}, actionable 0. That distribution is the acceptance criterion — the corpus names no counterparty''s
      means or motive, so a run reporting GROUNDED cases would be the defect.

      '
  COLD_START:
    status: PASS
    note: 'L-CLD-001, Founder 2dbc31a. Measured first: one sentence covered six situations, including
      a company nobody had looked at and a company whose sources went dark. Six coverage states now, each
      with its own sentence and its own must-not-conclude; every state short of OBSERVED is ASSERT_NONE.
      Every value carries its origin and a prior may not be spoken in the voice of an observation. LIVE
      on 25 dossiers: 3 OBSERVED, 22 PARTIALLY_OBSERVED. 30 tests, 16/16 break proofs. NOT BUILT and recorded:
      no streaming transport exists, so hydration is a state and provenance contract rather than a delivery
      path.

      '
  EXTERNAL_DATA_SANITATION:
    status: PASS
    note: 'L-SAN-001, scoped by measurement. A tokenised AST guard fails on any model-client import or
      call in src/intent_engine/market/ outside a declared-boundary allowlist, which is empty because
      no such call exists; it reads the syntax tree because this package discusses LLM proposals in prose
      and a grep would flag three innocent modules. Four injection payloads through the real translator:
      none becomes evidence. PASS is bounded to this branch — the FOUNDER obligation is a recorded cross-repo
      prerequisite, asserted by a test so a passing suite cannot be read as closing it.

      '
  INFORMATION_BARRIER:
    status: PASS
    note: 'L-TEN-001, market a5fcf60, for the V4-EXTERNAL scope only. The wall checked the right thing
      and trusted the wrong type: a bare string, in an engine whose most plentiful strings are company
      names parsed from documents. TenantScope carries the authority that established an identity; from_evidence
      exists and RAISES; permitted_facts accepts nothing else, so the wall is kept by the signature. tenant_scope
      is now the one production caller of internal_state. 26 tests, 11/11 break proofs. The internal Business
      Graph half remains V4-I9 and is NOT covered by this PASS.

      '
  ANTITRUST_AIR_GAP:
    status: PARTIAL
    note: 'The company-scoped half is enforced and tested: a canary private fact for TENANT_A is unreachable
      for TENANT_B through permitted_facts and through the join guard, seven injected identity shapes
      each refuse or read only what they own, and no aggregate path exists. Retrieval-key, cache and embedding-store
