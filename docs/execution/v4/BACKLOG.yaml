# Discoveries that are real and do NOT extend the V4 release frontier.
#
# See SEVERITY.md. HARDENING means the behaviour is correct and could be more
# robust. FUTURE_IMPROVEMENT means new capability. Neither opens a READY node;
# both are recorded so that "we did not notice" and "we noticed and did not
# schedule it" stay different statements.

contract: v4_backlog.v1

items:

  - id: BKL-EFFECT-TARGET-VOCAB
    class: HARDENING
    found_in: G-THE-004
    observed: >
      Every BELIEF-typed KnowledgeEffect in the live ledger carries an empty
      target_id (39 of 39), as does the majority of COMPANY_EXPOSURE effects
      written by the no-change path. `effects_bearing_on` skips empty target
      ids, so they can never attribute to anything.
    why_not_a_blocker: >
      A no-change effect legitimately names no target — it records that this
      evidence moved nothing, which is the row that keeps the denominator
      honest. The empty id is correct for that class. The BELIEF case is a
      separate producer whose targets are not thesis dependencies today, so
      no current claim rests on them matching.
    would_become_material_if: >
      a surface starts reporting belief-effect attribution rates, or a thesis
      declares a belief as a dependency object.

  - id: BKL-ATTEMPTED-COUNTS-SUBJECTS
    class: HARDENING
    found_in: "section 9 investigation, zero NO_RESULT anomaly"
    observed: >
      `counterparty_sources.Yield.documents_attempted` increments once per
      SUBJECT, while `documents_retrieved` increments once per DOCUMENT. A
      live outcome row therefore reads `attempted 28, retrieved 64`. The
      names say otherwise, and `research_planning.from_yield` carries them
      into `SourceFamilyPerformance` as `attempts` and `retrieved`.
    why_not_a_blocker: >
      Nothing divides one by the other today. `attempts` is used only to gate
      maturity at a PROVISIONAL threshold, and `SourceFamilyPerformance` has
      no production consumer outside its own module. No current claim is
      wrong.
    would_become_material_if: >
      any surface computes a retrieval or hit rate from the pair. It would
      read 228% on live data, and a rate above one is the kind of number a
      reader rationalises rather than reports.

  - id: BKL-SOURCE-DEGRADED-STATUS
    class: HARDENING
    found_in: "section 9 investigation"
    observed: >
      The outcome vocabulary is SUCCESS / NO_RESULT / NO_NEW_INFORMATION /
      REFUSED / FAILED / TIMEOUT. There is no SOURCE_DEGRADED, so a source
      that is reachable but returning less than it used to is recorded the
      same way as one that was asked and honestly held nothing.
    why_not_a_blocker: >
      New capability rather than a repair, and it is the smallest piece of a
      much larger pillar (source health lifecycle, cadence expectations,
      failure streaks, propagation into belief uncertainty). Adding the enum
      value alone would create a status nothing can ever set, which is the
      shape this project already has too much of.
    goes_to: "its own node when the source-health lifecycle is scoped"

  - id: BKL-EFFECT-READBACK
    class: HARDENING
    found_in: COMPLETE_NODE_MATURITY_AUDIT
    observed: >
      `store.record_knowledge_effect` is called by the cycle and
      `store.knowledge_effects()` is called by nothing in src/. No module
      filters the raw rows for `record == "knowledge_effect"` either. The
      persisted effects are a durable archive that no production path opens.
    why_not_a_blocker: >
      Attribution does not depend on reading them. `knowledge_step` loads the
      entire ledger and hands every evidence row ever stored to
      `company_exposure.profile`, so the effects are recomputed over full
      history each cycle and an old evidence row's effect is in memory
      regardless. Nothing claims prior cycles' persisted effects were read.
    would_become_material_if: >
      the exposure recomputation becomes incremental — scoped to newly
      acquired evidence rather than to every row. Attribution would then
      silently lose everything older than tonight, and `unattributed` would
      rise while reading like a finding about the evidence rather than about
      the scope of a loop. This is the same shape as
      `belief-formation-fresh-only`, which took a live zero to notice.

  - id: BKL-MECHANISM-CATALOGUE-KEYS
    class: HARDENING
    found_in: G-THE-004
    observed: >
      `Mechanism.key` falls back to the description when unset. Only
      `from_transmission` sets it today, so a mechanism written by any future
      producer inherits the rewording hazard identity was repaired to avoid.
    why_not_a_blocker: >
      Every mechanism reaching a persisted thesis today comes through
      `from_transmission`, which sets the key. The fallback is correct for
      one-off mechanisms nobody will reword.
    would_become_material_if: >
      a second producer of persisted theses appears.

  - id: BKL-SNAPSHOT-KEY-GRANULARITY
    class: HARDENING
    found_in: G-THE-004
    observed: >
      `record_thesis_snapshot` is idempotent on `(thesis_id, as_of)`, so
      re-running one date refuses every snapshot. That is correct, but it
      means a same-day re-run cannot record a thesis that genuinely moved
      between two runs of the same date.
    why_not_a_blocker: >
      The cycle runs once per operating day. A second run of one date is a
      rehearsal, and appending a second snapshot for it would make the
      "latest cycle" read ambiguous.
    would_become_material_if: >
      intra-day cycles are introduced.

  - id: BKL-THESIS-COMPETITION-DEPTH
    class: FUTURE_IMPROVEMENT
    found_in: G-THE-004
    observed: >
      With the area in `question_key`, the live corpus produces one thesis
      per question and `contested` is 0. Genuine competition needs two
      mechanisms proposed for one (subject, area, condition), which
      `_MECHANISM` cannot do — it is keyed by exposure dimension and returns
      exactly one route.
    why_not_a_blocker: >
      The previous `contested: 4` was an artefact of merging two economies'
      theses into one question, not evidence of competing explanations. Zero
      is the honest count for a catalogue with one route per dimension.
      Reporting rival mechanisms requires a second route to exist, which is
      new capability rather than a repair.
    goes_to: V5

  - id: BKL-EFFECT-CREATED-AT-IS-NOT-A-WRITE-TIME
    class: HARDENING
    found_in: I-ACC-001
    observed: >
      347 of 402 live KnowledgeEffects carry a `created_at` that is the
      EVIDENCE'S observation date, not the day the effect was written.
      `company_exposure.read_exposures` passes `created_at=observed`, while
      `belief_formation` correctly passes `created_at=as_of`. The store's
      own docstring says the id is keyed on "the day it was written", which
      is true for one writer and false for the other.

      Measured consequence: `created_at` on the effect log spans 2026-02 to
      2026-08, and the log's write path landed on 2026-08-09. Any rolling
      window keyed on that field manufactures a learning history for months
      in which the log did not exist.
    why_not_a_blocker: >
      The behaviour is deliberate and load-bearing. `effect_id` includes
      `created_at`, so a stable value is exactly what makes the nightly
      re-derivation of the standing evidence pool idempotent; setting it to
      `as_of` would append ~347 fresh NO_CHANGE rows every night, which is
      the "backfill counted as a day's learning" failure this project
      already refuses.

      I-ACC-001 does not depend on repairing it: windows key on ledger
      append order delimited by `cycle` records, which is a true write
      order, and break proof v4h-13 mutates the key to `created_at` and the
      guard holds.

      The clean repair is to key `effect_id` on the FACT's identity
      (evidence, target, effect_type, occurred_at) and let `created_at` be
      the honest write day. That changes the id of every row already
      written, so it needs a migration against a live append-only ledger
      and deserves its own node rather than a side effect of this one.
    goes_to: V4_LATE

  - id: BKL-RESEARCH-OUTCOME-EFFECT-LINK
    class: FUTURE_IMPROVEMENT
    found_in: I-ACC-001
    observed: >
      All 16 live `research_outcome` rows carry an EMPTY
      `knowledge_effect_ids` while accepting 11-12 evidence rows each. The
      field exists on the contract and nothing populates it, so there is no
      path from a research ACTION to what its evidence eventually CHANGED.
    why_not_a_blocker: >
      The research channel now reports UNMEASURABLE and names the missing
      field rather than dividing by it — the first implementation graded
      "0 of 14 productive", which is an accusation the ledger cannot
      support and reads identically to research that produced nothing.

      Populating the link is new capability, not a repair: the effects an
      action produced are not all known when the outcome is written, since
      an expectation opened today may resolve in three weeks. It belongs
      with the delayed-reward path, which already models that lag.
    goes_to: V4_LATE

  - id: BKL-SOURCE-STALENESS-FROM-CADENCE
    class: HARDENING
    found_in: L-SRC-001
    observed: >
      `SourceHealth.expected_cadence_days` is carried on the record and no
      code computes STALE from it. A feed answering every call with
      month-old figures is failing at its job while reporting HEALTHY.
    why_not_a_blocker: >
      The macro adapters do not publish a cadence, so the field has no
      populated source to read. Building the detector before the input
      exists would be a guard over an empty path — recorded as NOT_BUILT in
      break_proofs_v4i rather than proven against nothing.
    goes_to: V4_LATE

  - id: BKL-UNCLOSED-REGION-FALLBACK
    class: HARDENING
    found_in: E-DEM-001
    observed: >
      A page that opens <nav> and never closes it leaves the chrome region on
      the stack for the rest of the document, so <main> content is tagged
      chrome too, `body_blocks` comes back empty, and `parse_html`'s
      whole-page fallback then restores the navigation it was trying to
      strip. Reproduced deliberately while writing the parser tests.
    why_not_a_blocker: >
      Pre-existing and unrelated to the filing-prose repair: it is a property
      of the region stack, not of what gets buffered. A test asserting the
      correct behaviour was written, failed, and was REMOVED rather than left
      red or weakened — asserting a guarantee the parser does not make would
      have been a test about an intention.

      The real repair is for a region to close when its parent closes, which
      changes region semantics for every page and belongs in its own node.
    goes_to: V4_LATE
