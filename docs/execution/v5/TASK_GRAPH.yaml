  - id: A-DIAG-001
    program: A
    status: COMPLETE
    verification: CAPABILITY_VERIFIED
    completion_evidence: >
      aff8888 — five attacks plus two assumptions no series can settle, 25 tests, each failing case paired with a passing one. The standing comes from the existing economic_method.interpret, so there is no second vocabulary. Found two defects in A-SCM-001 committed hours earlier: an absolute epsilon that turned solver noise into a ratio of a thousand, and a placebo reporting FAILED when the panel was too small to reach its threshold. CAPABILITY-COMPLETE AND NOT LIVE-VERIFIED, on the same terms as A-SCM-001 and behind the same open node.
    title: Identification diagnostics — placebo, pre-trend, leakage, concentration
    dependencies: [A-SCM-001]
    priority: 1
    expected_value: >
      A sophisticated estimator that has not been attacked is a confident
      number. This node is the attack: in-space placebos on every donor,
      in-time placebos before the real treatment, a pre-trend test, a weight
      concentration check, and a post-treatment leakage check. An estimate
      whose placebo distribution contains effects as large as the treatment is
      BOUNDED regardless of how clean its fit looks.
    acceptance_criteria:
      - in-space placebo runs the same fit treating each donor as treated and
        reports the treated unit's rank in the effect distribution
      - in-time placebo refits at a pre-treatment date and reports the sham effect
      - a pre-trend divergence above threshold downgrades the estimate
      - weight concentration above threshold is reported as a named risk
      - any post-treatment observation reaching the fitting objective raises,
        it does not warn
      - each diagnostic emits an economic_method.MethodAssumptionCheck with a
        severity and its statistic, so the verdict comes from the EXISTING
        interpret() and its existing standings — USEFUL, BOUNDED, REFUSED,
        NO_INCREMENTAL_VALUE. A second verdict vocabulary beside that one is
        how the thesis and the proof package came to disagree in V3, and the
        estimate cannot be consumed above the standing interpret() returns
    tests: tests/test_market_causal_diagnostics.py
    minimum_data: none
    vertical:
      producer: intent_engine.market.causal_diagnostics.stress
      persistence: diagnostics block inside the causal_estimate row
      reload: verdict re-derivable from the persisted diagnostics, asserted
      consumer: economic_method.interpret, A-ASSUME-001, the standing wall
      surface: proof package and report.py causal block
      telemetry: verdict distribution per cycle
      failure_states: the economic_method standings, plus
        INSUFFICIENT_FOR_DIAGNOSIS for a fit too short to attack
      live_proof: a cycle report carrying a verdict other than IDENTIFIED
      adversarial_proof: the ten negative controls in section 11 of the
        constitution, each asserted separately
      mutation_target: the placebo rank comparison

  - id: A-ASSUME-001
    program: A
    title: Causal assumption registry — every estimate carries its unmet assumptions
    dependencies: [A-DIAG-001]
    priority: 1
    expected_value: >
      economic_method.check_assumptions already exists and already returns
      PASSED / FAILED / UNTESTED with CRITICAL and ADVISORY severities. What it
      does NOT have is any branch for the policy-effect methods: it dispatches
      on keywords drawn from the forecasting assumptions, so every assumption
      SYNTHETIC_CONTROL declares falls into the catch-all and is recorded
      CRITICAL/UNTESTED. That is honest and it means a synthetic control can
      never rise above BOUNDED however well it fits. This node wires the
      A-DIAG-001 diagnostics into that dispatch. It is an extension of one
      registry, explicitly not a second one — the same defect shape as a
      mechanism gate wired to one pattern with the rest carried as debt.
    acceptance_criteria:
      - every assumption string in METHODS either dispatches to a real check or
        is explicitly UNTESTABLE_HERE with the reason it cannot be tested
      - the count of assumptions with no branch is reported as a number, so the
        debt is measured rather than described
      - UNTESTED is never rendered as PASSED at any surface
      - a FAILED CRITICAL assumption keeps causal_reading_allowed false
      - check_assumptions remains the single definition; no surface re-derives
        assumption state from the estimate
    tests: tests/test_market_causal_assumptions.py
    minimum_data: none
    vertical:
      producer: intent_engine.market.causal_assumptions.evaluate
      persistence: assumptions block inside the causal_estimate row
      reload: assumption states reconstructed and re-checked on load
      consumer: economic_method.interpret and the standing_wall causal ceiling
      surface: report.py, proof package, Executive X-Ray causal row
      telemetry: assumptions by result, and the count with no branch
      failure_states: PASSED, FAILED, UNTESTED, UNTESTABLE_HERE
      live_proof: a cycle report showing at least one UNTESTED assumption
        travelling with an estimate
      adversarial_proof: a test asserting a VIOLATED assumption cannot be
        rendered as a supported causal claim at any surface
      mutation_target: the weakest-assumption reduction

  - id: A-MVE-001
    program: A
    title: Minimum Viable Experiment bridge — refusal becomes an experiment design
    dependencies: [A-ASSUME-001]
    priority: 1
    expected_value: >
      The single most valuable node in program A. Today an unidentifiable
      question terminates at UNMEASURABLE, which is honest and useless. This
      converts it into the cheapest experiment that would resolve the decision,
      with an explicit value-of-information test against its cost. It is also
      the node that stops "be more cautious" from being the system's only
      answer to uncertainty.
    acceptance_criteria:
      - an MVE is constructed only where a controllable decision exists; a
        question about an uncontrollable variable yields NO_CONTROLLABLE_ACTION
      - the record carries decision uncertainty, candidate action, states of
        world, current posterior, expected utility, experiment, expected
        information gain, cost, duration, exposure, kill switch, success
        metric, falsifier and ethical/security limits
      - VOI is computed as expected posterior decision value minus current
        decision value, and the arithmetic is asserted on a worked example
      - an experiment is RECOMMENDED only when VOI exceeds cost plus the risk
        threshold; otherwise NOT_WORTH_RUNNING with the shortfall shown
      - utilities are never fabricated — missing utility inputs produce a
        Minimum Data Request rather than a default
    tests: tests/test_market_minimum_viable_experiment.py
    minimum_data: none
    vertical:
      producer: intent_engine.market.minimum_viable_experiment.design
      persistence: experiment rows in the learning ledger
      reload: design reconstructed from the row and re-scored
      consumer: research_policy candidate set and the Founder decision surface
      surface: Executive X-Ray MISSING INFORMATION block
      telemetry: experiments designed / recommended / declined per cycle
      failure_states: NO_CONTROLLABLE_ACTION, UTILITIES_UNKNOWN,
        NOT_WORTH_RUNNING, RECOMMENDED
      live_proof: a cycle in which a refused causal question emits a design
      adversarial_proof: a test that a fabricated utility cannot enter the VOI
        computation, and that VOI <= 0 never yields RECOMMENDED
      mutation_target: the VOI comparison operator

