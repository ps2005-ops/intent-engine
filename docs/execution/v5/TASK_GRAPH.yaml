      - the T0 snapshot builder refuses any record whose known_at, published_at
        or retrieved_at is after T0, and the refusal is counted not silent
      - published_at is never substituted for retrieved_at anywhere in the
        builder, asserted by test
      - an episode whose outcome was revised after T0 is flagged REVISED and
