[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-engine"
version = "0.1.0"
requires-python = ">=3.9"
# Runtime dependencies of the DEPLOYED service. Deployment builds with
# `pip install -e .` (see render.yaml) and never reads requirements.txt, so a
# dependency the deployed code needs has to be declared HERE or it is simply
# absent in production. Everything else in the ingestion path is stdlib
# (urllib); pypdf is the one exception, and without it every investor PDF
# degrades to "PDF support is not installed in this deployment" forever.
# requirements.txt keeps the exact pin for reproducible CI.
# Pinned, not a range. A range meant a production build resolved to whatever
# pypdf was newest that day (observed: 5.9.0) while CI tested the 5.1.0 pinned
# in requirements.txt — two different libraries under one "verified" claim,
# and two deploys of the same commit could differ. A frozen release must build
# the same way twice.
dependencies = [
    "pypdf==5.1.0",
]

[project.scripts]
premortem = "intent_engine.simulator.cli:main"
delegate = "intent_engine.voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
