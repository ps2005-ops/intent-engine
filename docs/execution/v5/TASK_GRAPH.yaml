      mutation_target: the population filter predicate

  - id: B-RM-001
    program: B
    title: Reward model over historical replay, held-out validated
    dependencies: [B-HIST-002]
    priority: 2
    expected_value: >
      Doubly-robust evaluation needs a reward model that has been validated on
      data it did not see. Without this, DR is a point estimate whose second
      term is unfalsifiable. Trained on HISTORICAL only, and reported as such.
    acceptance_criteria:
      - train and held-out splits are by episode and by time, never random
      - held-out performance is reported against a persistence baseline and a
        model that does not beat it is marked UNUSABLE_FOR_DR
      - the model records which population it was trained on
    tests: tests/test_market_reward_model.py
    minimum_data:
      historical_decision_episodes: 40
    vertical:
      producer: intent_engine.market.reward_model.train
      persistence: reward_model rows with training population and split spec
      reload: model reloads and reproduces held-out scores within tolerance
      consumer: B-DR-001
      surface: learning report reward-model block
      telemetry: held-out skill vs baseline
      failure_states: UNUSABLE_FOR_DR, INSUFFICIENT_EPISODES, LEAKED_SPLIT
      live_proof: a persisted model with held-out numbers from a real corpus
      adversarial_proof: a random split must be refused by the trainer
      mutation_target: the split boundary

  - id: B-DR-001
    program: B
    title: Doubly-robust off-policy evaluation that refuses without support
    dependencies: [B-RM-001]
    priority: 2
    expected_value: >
      The logging policy is deterministic: every propensity is 1 or 0 and
      importance weighting is undefined. research_policy already records that
      finding. This node builds the estimator anyway AND builds the guard that
      makes it refuse today, so the day a randomised arm exists the evaluation
      is real rather than retrofitted.
    acceptance_criteria:
      - the evaluator checks logged propensity presence, positive support for
        the chosen action, target/logger overlap, effective sample size and
        weight boundedness before producing any number
      - a deterministic logger with a target policy choosing unseen actions
        yields BLOCKED_DATA and no estimate
      - when it does estimate, it reports the interval, ESS, max and clipped
        weights, support violations and a sensitivity curve
    tests: tests/test_market_doubly_robust.py
    minimum_data:
      logged_exploration_events: 200
    vertical:
      producer: intent_engine.market.off_policy.doubly_robust
      persistence: ope_estimate rows
      reload: estimate and diagnostics reload together or neither
      consumer: B-POL-002 policy comparison in the V4 graph
      surface: policy section of the learning report
      telemetry: OPE attempts by refusal reason
      failure_states: NO_PROPENSITY, NO_SUPPORT, LOW_ESS, UNBOUNDED_WEIGHTS,
        REWARD_MODEL_UNUSABLE
      live_proof: a persisted refusal carrying the measured ESS
      adversarial_proof: a deterministic log must never produce a DR number
      mutation_target: the support check

  # ---- PROGRAM C: BEHAVIORAL GAME ENGINE --------------------------------
  # Extends AdversaryCase and strategic_interaction. Not a second competitor
  # system; section 19.

  - id: C-STAND-001
    program: C
    title: MODEL_EXPECTED_RESPONSE added to the standing wall, below OBSERVED
    dependencies: []
    priority: 1
    expected_value: >
      AdversaryCase already orders CAPABILITY, INCENTIVE, OBSERVED_ACTION and
      HYPOTHESIZED_RESPONSE. A Level-k or QRE output is none of those: it is
      stronger than a move somebody thought of and weaker than a move anybody
      saw. Adding the standing BEFORE the models exist is deliberate — the
      alternative is a model whose output has to be squeezed into an existing
      label, which is how simulated behaviour becomes reported behaviour.
    acceptance_criteria:
      - the standing sits strictly between INCENTIVE and OBSERVED_ACTION
      - no constructor can produce OBSERVED_RESPONSE from a model
      - every surface's certainty vocabulary is extended for the new standing
        and a test asserts the ceiling narrows
    tests: tests/test_market_standing_wall.py
    minimum_data: none
    vertical:
      producer: standing_wall and adversary_case standing vocabulary
      persistence: standing field on response records
      reload: standing re-validated on load; unknown standing refuses
      consumer: C-LK-001, C-QRE-001, report.py, proof package
      surface: adversary block on every executive surface
      telemetry: responses by standing per cycle
      failure_states: UNKNOWN_STANDING_REFUSED
      live_proof: a cycle report with responses at the new standing
      adversarial_proof: a test that a model output cannot be rendered with
        observed-behaviour wording
      mutation_target: the standing ordering tuple

  - id: C-LK-001
    program: C
    title: Level-k reaction trees, bounded at L2
    dependencies: [C-STAND-001]
    priority: 1
    expected_value: >
      Static downside scenarios do not answer "and then what". L0 is the
      actor's current trajectory, L1 the direct response to our move, L2 the
      response that anticipates our adaptation. Depth is capped at 2 because
      higher k adds fiction faster than intelligence, and the cap is in the
      constructor rather than in a comment.
    acceptance_criteria:
      - L0 is derived from observed trajectory evidence, not assumed
      - each level names the evidence that makes the actor capable of it, and
        a level with no capability evidence is dropped, not softened
      - depth above 2 raises; there is no configuration that permits L3
      - every node in the tree carries MODEL_EXPECTED_RESPONSE standing
    tests: tests/test_market_level_k.py
    minimum_data: none
    vertical:
      producer: intent_engine.market.level_k.build_tree
      persistence: reaction_tree rows keyed to the move and actor
      reload: tree reloads with standings intact
      consumer: adversary_case and the scenario surface
