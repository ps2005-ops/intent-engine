      reload: curve recomputed from resolved expectations on load
      consumer: the learning report and the Founder confidence wording
      surface: X-Ray decision-impact block
      telemetry: bins, sample size per bin, excluded expectations
      failure_states: INSUFFICIENT_RESOLUTIONS, NO_OBSERVABLE, WELL_CALIBRATED,
