axes:
  LEARNING_ACCELERATION:
    status: PASS
    note: 'I-ACC-001, live at 80f3aa5. Seven channels derived from the effect log, computed independently
      and never averaged, each carrying its numerator, denominator and sample maturity. Live: ECONOMIC
      29/402 (7.2%) DEGRADING MATURE; SYSTEM 20/41 INSUFFICIENT_HISTORY; CALIBRATION 3/11 STABLE EARLY;
      FOUNDER UNMEASURABLE; RETENTION 402/402 STABLE; RESEARCH UNMEASURABLE; UNSUPERVISED 1/3 EARLY_WARNING.
      HIGH_ACTIVITY_LOW_LEARNING detected on real data. PASS is about the MEASUREMENT, not the readings:
      the engine is now able to say it is barely learning, which it previously could not.

      '
  SOURCE_HEALTH:
    status: PASS
    note: 'L-SRC-001, live at 8f14906. Source health is a persisted state per family per cycle with streak
      and last_success, not a line in one report. A degraded source raises uncertainty and never weakens
      the claim, proven by mutation. An unrecognised failure is UNCLASSIFIED with its message kept rather
      than mapped onto the nearest known state. BLS has been 503 on every recorded cycle and is now
      visible as a state. Staleness from expected cadence is recorded NOT_BUILT: nothing reads the field.

      '
  ADVERSARY_ENGINE:
    status: NOT_STARTED
    note: 'L-ADV-001, READY. AdversaryCase over existing thesis/falsifier records. The V3 premortem exists
      (core/premortem_prediction_bridge.py); what is missing is the bounded analytical object that
      separates CAPABILITY from INCENTIVE from OBSERVED_ACTION from HYPOTHESIZED_RESPONSE, so that a
      rival''s mere existence cannot produce a predicted action.

      '
  COLD_START:
    status: V4_EXTERNAL_PENDING
    note: 'L-CLD-001, READY, recorded against the FOUNDER repository because hydration and the decision
      surface live there. The invariant to verify: no prior or sector default is ever rendered in the
      same voice as an observation.

      '
  EXTERNAL_DATA_SANITATION:
    status: PARTIAL
    note: 'L-SAN-001, READY, and scoped by MEASUREMENT rather than assumption: the market pipeline has no
      LLM call site at all, so scraped text is inert here by construction rather than by design. The live
      injection boundary is the seam into Founder reasoning, which does call a model. The bounded guard
      here is that a call site cannot appear in market/ without a declared data boundary.

      '
  INFORMATION_BARRIER:
    status: V4_INTERNAL_REQUIRED
    note: 'L-BAR-001, NOT_APPLICABLE on this branch and recorded so it is inherited. Taint tracking,
      tenant-scoped graph and retrieval, egress controls, secret redaction, private/public separation at
      prompt assembly and a tool permission wall all require private tenant data to separate from public
      data. There is none here, so every control would pass against nothing. Belongs to V4-I9.

      '
  ANTITRUST_AIR_GAP:
    status: V4_INTERNAL_REQUIRED
    note: 'L-ANT-001, NOT_APPLICABLE on this branch. What the external foundation already guarantees:
      competitive reasoning runs on public evidence, and company-published sources may not establish
      COMPETES_WITH. A cross-tenant air-gap needs more than one tenant; marking it PASS on a
      single-tenant public-data system would be true and worthless. Belongs to V4-I10.

      '
  EVIDENCE_EXTRACTION:
    status: PARTIAL
    note: 'E-DEM-001, repaired at 69a2438. The parser was discarding 79% of every filing: text was
      buffered only inside a block-tag whitelist that had no <div>, and SEC filings write prose in
      <div>/<font>. Measured on Caterpillar Q2 2026: 13,462 -> 33,742 characters, 30 -> 128 candidate
      sentences, 0 -> 5 demand sentences. PARTIAL not PASS: the sentences now reach the classifier and
      the classifier still refuses the narrative ones, because no family carries orders, bookings or
      shipments as an object. Coverage in the LEDGER changes only as new cycles ingest — the corpus
      already written was extracted under the old parser and is not rewritten.

      '
