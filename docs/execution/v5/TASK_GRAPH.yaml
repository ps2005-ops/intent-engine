# TASK_GRAPH.yaml -- machine-readable V5 backlog.
#
# V4 built an engine that can see the outside world and refuse to overclaim
# about it. V5 asks the next question: when the engine refuses, what should
# the company DO? The answer running through every program here is that a
# refusal is an information-acquisition decision, not a dead end.
#
# WHAT IS DIFFERENT FROM THE V4 GRAPH
# -----------------------------------
# `requires_vertical: true`. Every node names its producer, persistence,
# reload, consumer, surface, telemetry, failure states, live proof,
# adversarial proof and mutation target BEFORE it is implemented, and
# `frontier.py --check` refuses the graph otherwise. V4 stated those ten
# questions in prose and still shipped four capabilities with zero production
# callers, a write path nothing called, and a metric that could not report a
# negative. Prose is not a gate.
#
# NODES ARE PRODUCT CAPABILITIES, NOT CLASSES
# -------------------------------------------
# Thirty-two nodes, not a hundred. A node that is a helper class belongs
# inside another node. The graph must converge; see section 39 of the
# execution constitution.
#
# HISTORICAL IS NOT PROSPECTIVE
# -----------------------------
# Program B builds a historical decision corpus and is forbidden from
# counting one row of it toward the prospective gates in the V4 graph. The
# populations are tagged at write time and separated at read time. Relabelling
# is the leak this system spent months removing.

contract: v5_task_graph.v1
repository_default: market
requires_vertical: true
generated_at: "2026-08-10"
predecessor: docs/execution/v4/TASK_GRAPH.yaml

programs:
  A: CAUSAL DECISION INTELLIGENCE
  B: HISTORICAL AND POLICY LEARNING
  C: BEHAVIORAL GAME ENGINE
  D: INTERNAL ENTERPRISE INTELLIGENCE
  E: DECISION AND EXECUTION OS
  F: ENTERPRISE SECURITY AND TRUST
  G: EXECUTIVE EXPERIENCE
  H: META-LEARNING AND SELF-IMPROVEMENT

tasks:

  # ---- PROGRAM A: CAUSAL DECISION INTELLIGENCE --------------------------
  # The canonical loop: IDENTIFY -> ESTIMATE -> STRESS TEST -> REFUSE OR
  # ACCEPT -> IF REFUSED, DESIGN THE EXPERIMENT THAT WOULD RESOLVE IT.

  - id: A-SCM-001
    program: A
    status: COMPLETE
    verification: CAPABILITY_VERIFIED
    completion_evidence: >
      aff8888 (merge of 64d6d14) — simplex active-set solver, six named refusals, 29 tests. Three descent solvers were written and measured first and each returned the WRONG DONORS on a nearly-collinear pool; the shipped solver recovers 0.5/0.3/0.2 exactly. Live: SYNTHETIC_CONTROL now carries a real effect_estimator in economic_method.METHODS and `require` refuses it for a forecast. CAPABILITY-COMPLETE AND NOT LIVE-VERIFIED — no cycle has called it and `grep -n synthetic_control src/intent_engine/market/steps.py` returns nothing; A-WIRE-001 is the open node that closes that, and until it closes this node may not be read as running in production.
    title: Synthetic control estimator, donor pool and weights, not an enum entry
    dependencies: []
    priority: 1
    expected_value: >
      SYNTHETIC_CONTROL has been declared in economic_method.METHODS with
      estimator=None since V4. `require` refuses it correctly, which means
      every EFFECT_OF_POLICY question the engine has ever been asked has
      fallen back to a method whose assumptions are weaker. This is the first
      estimator in the system that can answer "what would have happened
      otherwise" for a single treated unit.
    acceptance_criteria:
      - a fit takes a treated series, a donor pool, and a treatment index, and
        returns unit weights that are non-negative and sum to one
      - weights are fitted on pre-treatment outcomes ONLY; the treatment index
        partitions the series and no post-treatment point enters the objective
      - pre-treatment fit quality is reported as RMSPE, not asserted
      - a donor pool that cannot reproduce the pre-period yields REFUSED with
        the shortfall quantified, never a fitted path
      - the result names every donor with non-zero weight, so a synthetic
        control carried by one donor is visible rather than implied
    tests: tests/test_market_synthetic_control.py
    minimum_data: none
    vertical:
      producer: intent_engine.market.synthetic_control.fit
      persistence: causal_estimate rows in reports/market/learning_ledger.jsonl
      reload: synthetic_control.load_estimate reconstructs from the row
      consumer: economic_method.METHODS[SYNTHETIC_CONTROL].estimator and steps.py
      surface: report.py economic_method block; Founder proof package
      telemetry: causal_estimates_attempted / _refused counters per cycle
      failure_states: REFUSED_NO_DONOR_SUPPORT, REFUSED_POOR_PRE_FIT,
        REFUSED_SHORT_PRE_PERIOD, REFUSED_DEGENERATE_WEIGHTS
      live_proof: a PAPER cycle report containing one fitted or one refused
        estimate with named donors
      adversarial_proof: tests in A-DIAG-001 (placebo, leakage, single-donor)
      mutation_target: the pre/post partition in the objective function

