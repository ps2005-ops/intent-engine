# F. Prediction resolution — resolve predictions whose horizon has completed.
# Catch-up: resolves everything overdue, so a skipped run loses nothing.
name: prediction-resolution

on:
  schedule:
    - cron: "17 23 * * 1-5"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Override date (YYYY-MM-DD); blank = today (NY)"
        required: false

concurrency:
  group: prediction-resolution
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  call:
    uses: ./.github/workflows/_hosted-job.yml
    secrets: inherit
    with:
      job: prediction-resolution
      as_of: ${{ github.event.inputs.as_of }}
      timeout_minutes: 20
