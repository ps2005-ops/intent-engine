# TASK_GRAPH.yaml -- machine-readable V4 backlog.
#
# Status vocabulary is defined in AGENT_PROTOCOL.md. A BLOCKED_* node is
# terminal for that node only and leaves the runnable frontier; it does not
# stop the program.
#
# `minimum_data` is a GATE, not an aspiration. A node whose minimum_data is
# unmet is BLOCKED_DATA with the shortfall quantified, and a COLLECT
# prerequisite is created.
#
# Derived 2026-08-09 from: docs/EXECUTION_CHECKPOINT.md, the session-3
# closure matrix (PASS 11 / PARTIAL 25 / BLOCKED_DATA 1 / NO 1), direct
# reading of src/intent_engine/market/, and reconciliation against the live
# ledger and run reports.

contract: v4_task_graph.v1
repository_default: market
generated_at: "2026-08-09"

programs:
  A: RESEARCH OBSERVABILITY
  B: ACTIVE RESEARCH LEARNING
  C: ECONOMIC METHODS
  D: HISTORICAL SCIENTIFIC VALIDATION
  E: WORLD MODEL
  F: STRATEGIC ECONOMIC REASONING
  G: THESIS / PROOF
  H: FOUNDER / CEO
  I: META-LEARNING
  J: ROBUSTNESS
  K: LIVE VALIDATION

tasks:

  # ---- PROGRAM A: RESEARCH OBSERVABILITY --------------------------------
  # The root of the graph. Everything in B, and the reward half of I,
  # depends on these.

  - id: A-RD-001
    program: A
    title: ResearchDecision written BEFORE the external call
    dependencies: []
    status: COMPLETE
    priority: 1
    expected_value: >
      Unblocks all of PROGRAM B. Without it the research log is a success log:
      actions returning nothing are structurally absent.
    acceptance_criteria:
      - a decision record is durably written before any external research call
      - carries state_snapshot_id, subject, question_id, question_type,
        missing_fact, candidate_actions, chosen_action, selection_policy,
        policy_version, expected_voi, expected_cost, budget_remaining,
        source_family, query_strategy, selection_probability,
        selection_probability_status, chosen_at, provenance
      - selection_probability_status distinguishes KNOWN / DETERMINISTIC /
        UNAVAILABLE and a deterministic policy is never given a fake propensity
    tests: tests/test_market_research_decision.py
    minimum_data: none
    completion_evidence: "b34ee0e+pending; 77 tests green across research_decision, wiring and policy"

  - id: A-RD-002
    program: A
    title: Candidate action set recorded, including unchosen options
    dependencies: [A-RD-001]
    status: COMPLETE
    priority: 1
    expected_value: >
      Load-bearing and currently the single largest defect in policy
      evaluation. research_policy.evaluate_offline offers ALL five families as
      options on EVERY record, so a policy is scored against a choice set that
      never existed. Recording the real eligible set is what makes any policy
      comparison mean anything.
    acceptance_criteria:
      - every eligible candidate is recorded with source_family, query_strategy,
        estimated_cost, estimated_latency, expected_voi, eligible, refusal_reason
      - unchosen candidates are present
      - cadence-blocked families appear as ineligible WITH the reason, not as
        absent
    tests: tests/test_market_research_decision.py
    minimum_data: none
    completion_evidence: "b34ee0e+pending; 77 tests green across research_decision, wiring and policy"

  - id: A-RD-003
    program: A
    title: DecisionOutcome, preserving NO_RESULT and FAILED
    dependencies: [A-RD-001]
    status: COMPLETE
    priority: 1
    expected_value: >
      NO_RESULT is training data. Discarding it is what makes the historical
      log biased toward success.
    acceptance_criteria:
      - status in SUCCESS / NO_RESULT / NO_NEW_INFORMATION / REFUSED / FAILED /
        TIMEOUT
      - carries decision_id, timings, documents_attempted, documents_retrieved,
        accepted_evidence, refused_evidence, new/independent/dependent events,
        knowledge_effect_ids, immediate_reward, latency, cost, failure_type
      - an outcome cannot be written without a matching decision_id
    tests: tests/test_market_research_decision.py
    minimum_data: none
    completion_evidence: "b34ee0e+pending; 77 tests green across research_decision, wiring and policy"

  - id: A-RD-004
    program: A
    title: DelayedOutcome appended, never mutating immediate reward
    dependencies: [A-RD-003]
    status: COMPLETE
    priority: 2
    expected_value: Supports delayed credit assignment; closes the reward path from I.
    acceptance_criteria:
      - append-only; the original immediate reward is never rewritten
      - fires on belief resolved / falsifier resolved / hypothesis discriminated
        / mechanism tested / thesis changed / Founder DecisionImpact
      - carries decision_id, outcome_type, target_id, reward_delta, observed_at,
        provenance
    tests: tests/test_market_research_decision.py
    minimum_data: none
    completion_evidence: "b34ee0e+pending; 77 tests green across research_decision, wiring and policy"

  - id: A-RD-005
    program: A
    title: PROSPECTIVE / RECONSTRUCTED wall
    dependencies: [A-RD-001]
    status: COMPLETE
    priority: 1
    expected_value: >
      Prevents the reconstructed success log from silently establishing policy
      value once a real log exists alongside it.
    acceptance_criteria:
      - every research row carries provenance PROSPECTIVE or RECONSTRUCTED
      - policy evaluation reports the two separately
      - a guard refuses to declare a policy production-ready primarily from
        reconstructed data
    tests: tests/test_market_research_decision.py
    minimum_data: none
    completion_evidence: "b34ee0e+pending; 77 tests green across research_decision, wiring and policy"

  - id: A-RD-006
    program: A
    title: Bounded state snapshot for policy learning
    dependencies: [A-RD-001]
    status: COMPLETE
    priority: 2
    expected_value: Gives a future policy a stable feature vector to condition on.
    acceptance_criteria:
      - bounded, stable features only; no arbitrary application state
      - open hypotheses, uncertainty, stale knowledge, falsifiers, source
        performance, question type, budget, world-model gaps
      - snapshot is content-keyed and referenced by id from the decision
    tests: tests/test_market_research_decision.py
    minimum_data: none
    completion_evidence: "b34ee0e+pending; 77 tests green across research_decision, wiring and policy"

  - id: A-RD-007
    program: A
    title: INSTRUMENT -- production acquisition path writes decisions
    dependencies: [A-RD-001, A-RD-002, A-RD-003, A-RD-005, A-RD-006]
    status: COMPLETE
    priority: 1
    expected_value: >
      The BUILD/INSTRUMENT split exists because of two recorded failures where
      an API existed and the cycle never called it. This node is the call site.
    acceptance_criteria:
      - steps.source_acquisition_step writes a decision before CS.measure and an
        outcome after, for every family including cadence-skipped ones
      - LearningStore has record + read methods and the record kinds are
        registered
      - a FRESH PROCESS reads back what the cycle wrote
    tests: tests/test_market_research_decision_wiring.py
    minimum_data: none
    completion_evidence: "431538b; live night cycle 2026-08-09 wrote 2 decisions + 2 outcomes to the production ledger at /Users/prathamsharma/intent-engine-market; candidate sets carry the cadence-blocked family with its reason; fresh-process readback verified by test and by direct probe"

  - id: A-RD-008
    program: A
    title: COLLECT -- run a real PAPER cycle and report the counts
    dependencies: [A-RD-007]
    status: COMPLETE
    priority: 1
    expected_value: The first legitimate prospective policy-training records.
    acceptance_criteria:
      - a real production-equivalent cycle, not a fixture
      - reports decisions, candidate sets, chosen, no-result, failed,
        state-changing, no-change, immediate reward
      - counts are read from the persisted ledger, not from an in-process probe
    tests: null
    minimum_data: none
    completion_evidence: "live night cycle EXIT=0; 2 prospective decisions, 2 outcomes, both SUCCESS, 0 empty-handed, 2 with a forgone option; standing REPLAY_ONLY"

  # ---- PROGRAM B: ACTIVE RESEARCH LEARNING ------------------------------

  - id: B-VOI-001
    program: B
    title: Diagnose the VOI filing bias by measurement
    dependencies: []
    status: COMPLETE
    priority: 2
    expected_value: >
      A live, falsifiable defect in a policy that is reported every cycle.
      Independent of the collection nodes, so it runs in parallel.
    acceptance_criteria:
      - the cause is traced, not assumed; candidates are stale
        SourceFamilyPerformance, low duplication penalty, undervalued
        independence, question-type routing mismatch, cost/latency imbalance
      - independent_reporting > filing is NOT hardcoded
      - before/after routing compared on knowledge change per action,
        discrimination, duplicate rate, cost, latency
    tests: tests/test_market_research_policy.py
    minimum_data: none
    completion_evidence: "measured on the 316-row reconstructed log: VOI_HEURISTIC identical to FIXED_REGULATORY_FILING on all six figures; independence 1.0 both, duplication 0.75 vs 0.027; cause isolated to a constant order whose stated rationale does not discriminate"

  - id: B-POL-001
    program: B
    title: Choice-set-aware offline evaluation
    dependencies: [A-RD-002, B-VOI-001]
    status: COMPLETE
    priority: 2
    expected_value: >
      evaluate_offline currently assumes all five families were available on
      every decision. Scoring against the recorded eligible set is a
      correctness fix, not a feature.
    acceptance_criteria:
      - a policy is scored only against the candidate set actually recorded
      - overlap is reported against the real choice set
      - reconstructed rows, which have no recorded choice set, are reported
        separately and never pooled
    tests: tests/test_market_research_policy.py
    minimum_data: none
    completion_evidence: "choice-set-aware evaluate_offline; assumed_menu reported; menu_is_real kept out of trustworthy so the reward-hack audit stays on"

  - id: B-POL-002
    program: B
    title: Baseline policy comparison on prospective data
    dependencies: [A-RD-008, B-POL-001]
    status: BLOCKED_DATA
    priority: 3
    acceptance_criteria:
      - static order, historical acceptance, historical knowledge-change rate,
        source-performance, VOI heuristic, random
      - immediate and delayed reward both reported
    minimum_data: prospective_decisions >= 100
    completion_evidence: null

  - id: B-VOI-002
    program: B
    title: Predicted vs realized VOI calibration
    dependencies: [A-RD-008]
    status: BLOCKED_DATA
    priority: 3
    acceptance_criteria:
      - expected_voi paired with realized KnowledgeEffect-derived utility
      - persisted as VOICalibration
      - reports where VOI is miscalibrated, by question type and source family
    minimum_data: prospective_decisions >= 50
    completion_evidence: null

  - id: B-HACK-001
    program: B
    title: Reward-hack audit re-run on prospective data
    dependencies: [A-RD-008]
    status: BLOCKED_DATA
    priority: 3
    expected_value: >
      Session 3 corrected a false HACKABLE finding: the volume arm was also the
      value arm. The correct test is whether an attack wins while changing LESS
      than the best honest policy. That test must now run on real records.
    acceptance_criteria:
      - attacks span volume, cheap sources, confirmation bias, document-rich
        companies, trivial questions, duplicated news, easy facts, noisy numerics
      - reports best honest strategy, best attack, change rate, discrimination,
        delayed utility, cost
      - a low-change window reports UNRESOLVED rather than a smoothed pass
    minimum_data: prospective_decisions >= 100
    completion_evidence: null

  - id: B-BANDIT-001
    program: B
    title: Bandit maturity ladder, one step only
    dependencies: [B-POL-002, B-HACK-001]
    status: BLOCKED_DATA
    priority: 5
    expected_value: >
      Deliberately parked. L0 interface exists (ContextualBanditPolicy). The
      logging policy is deterministic, so every propensity is 1 or 0 and
      off-policy estimators are inapplicable, not merely imprecise.
    blocker: >
      Valid counterfactual evaluation requires logged exploration. None exists.
      Build only the next justified maturity step; do not fit a bandit to
      satisfy a checklist.
    minimum_data: prospective_decisions with logged exploration >= 200
    completion_evidence: null

  - id: B-POL-003
    program: B
    title: Policy maturity states
    dependencies: [B-POL-002]
    status: WAITING_DEPENDENCY
    priority: 4
    acceptance_criteria:
      - NOT_READY / EARLY / OFFLINE_EVALUABLE / OUTPERFORMING / DEPLOYABLE /
        DEGRADED
      - thresholds are not chosen to reach DEPLOYABLE
      - expected current state is EARLY and that is an acceptable answer
    minimum_data: none
    completion_evidence: null

  # ---- PROGRAM C: ECONOMIC METHODS --------------------------------------

  - id: C-MET-001
    program: C
    title: EconomicMethod registry
    dependencies: []
    status: READY
    priority: 3
    acceptance_criteria:
      - each method declares question types, input requirements, minimum
