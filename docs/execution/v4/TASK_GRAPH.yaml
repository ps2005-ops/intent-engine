  # ---- PROGRAM L: SYSTEMIC RESILIENCE AND TRUST -------------------------
  #
  # THE ONE-TIME ROADMAP RECONCILIATION, 2026-08-09.
  #
  # The governing roadmap added five systemic pillars AFTER this graph was
  # derived, so they sat outside the frontier: not deferred, not refused,
  # simply unrepresented. A requirement that cannot appear in the frontier
  # cannot be scheduled against, and the omission is itself material.
  #
  # This is that reconciliation, performed ONCE. The convergence rule in
  # SEVERITY.md otherwise forbids new scope; governing-plan requirements are
  # its stated exception, and the exception is spent here. These five are not
  # to be rescoped again session by session.
  #
  # THE RULE APPLIED: build only what THIS branch can honestly verify.
  # Two of the five need an internal Business Graph that does not exist, and
  # a private-data firewall built where there is no private data would be
  # architecture-only completion — the exact failure mode this program keeps
  # having to undo. They are recorded as V4-INTERNAL handoff prerequisites
  # with their invariants stated now, so the internal phase inherits them as
  # requirements rather than rediscovering them.

  - id: L-SRC-001
    program: L
    title: Source health is a state, so a dead source cannot read as a quiet economy
    dependencies: []
    status: COMPLETE
    priority: 2
    severity: MATERIAL_DEFECT
    expected_value: >
      NOT speculative — measured on every live cycle. The Bureau of Labor
      Statistics has returned "HTTP Error 503: Service Unavailable" on every
      run in the record; one of six macro series families is down, and has
      been for the whole observed history.

      Today that failure is reported per cycle in `research.macro.failures`
      and nowhere else. There is no state, so there is no streak, no
      last_success, no expected cadence and no fallback. The consequence is
      the one this pillar exists to prevent: a thesis whose evidence comes
      from a degraded source stops receiving confirming evidence, and the
      engine cannot tell that from the economy going quiet. OBSERVABILITY
      FELL; the engine would report that ACTIVITY fell.

      This is the same class as `observability is not validity`: a real
      rivalry with a silent rival is unlearnable, and the honest reading is
      reduced visibility, never a weakened claim.
    acceptance_criteria:
      - a persisted SourceHealth record per source family carrying at least
        state, detected_at, last_success, failure streak, expected cadence
        and the failure that produced it
      - states are explicit — HEALTHY / DEGRADED / UNAVAILABLE /
        RATE_LIMITED / AUTH_EXPIRED / SCHEMA_CHANGED / PARSER_BROKEN /
        STALE / RETIRED — and an unrecognised failure is never silently
        mapped onto the nearest one
      - a degraded source RAISES uncertainty on the beliefs it feeds and
        never weakens the economic claim itself; a test drives a source from
        HEALTHY to UNAVAILABLE and asserts the thesis standing is unchanged
        while its observability is reduced
      - fallback routing is provenance-tracked; a substituted source is
        recorded as a substitution and never silently swapped
      - the live BLS 503 appears as a DEGRADED or UNAVAILABLE state in a
        real cycle artifact, not only in a test
    maturity_required: EVALUATED
    tests: tests/test_market_source_health.py
    minimum_data: none
    completion_evidence: "LIVE at runtime_git_sha 8f14906, night cycle 2026-08-09, dry_run false. The Bureau of Labor Statistics 503 now appears as a STATE in the dated artifact: DEGRADED, failure_streak 1, last_success '' (it has never succeeded in the record, and the empty string says so rather than inventing a date). observability 0.8333, 5 of 6 families delivering, unclassified []. Six source_health rows persisted to the ledger — successes included, because 'when did this last work' is the question that decides whether silence is new — and repeats are not deduped, because it is the streak that turns a bad minute into an outage. The rule is proven by mutation rather than asserted: break proofs v4i-4 and v4i-5 shade the confidence and suppress the uncertainty flag, and both are caught. 30 tests. 1 recorded NOT_BUILT: staleness from expected cadence has no reader, since the macro adapters publish no cadence."

