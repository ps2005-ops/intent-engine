# THE COMPLETION MATRIX — one machine-readable source.
#
# A previous hand-written matrix said "PARTIAL (10)" above a table containing
# twelve PARTIAL rows. A completion matrix that cannot count itself is not
# authoritative, so counts are never typed here: `scripts/market_matrix.py`
# derives them, and a test asserts the derivation equals the rows.
#
# TWO AXES, DELIBERATELY.
#   capability        — is the seam built, called, persisted, reloaded,
#                       consumed, reported, and proven?
#   empirical         — has enough real data arrived for the numbers to mean
#                       something?
# A conservative channel with a complete seam and no movement today is
# capability=PASS, empirical=RAN_NO_CHANGE. Collapsing those into PARTIAL is
# what kept twelve finished subsystems looking unfinished.

