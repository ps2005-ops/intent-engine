  - id: A-SDID-001
    program: A
    title: Synthetic difference-in-differences, unit AND time weights
    dependencies: [A-SCM-001]
    priority: 2
    expected_value: >
      Plain synthetic control matches the pre-period level and is fragile when
      the treated unit's pre-period is atypical in TIME as well as in
      cross-section. SDID adds time weights so periods unlike the treatment
      window are downweighted, and it degrades to DiD rather than to nonsense
      when the donor pool is thin.
    acceptance_criteria:
      - SYNTHETIC_DID exists as a distinct method name with its own
        assumptions and failure modes, not an alias of SYNTHETIC_CONTROL
      - time weights are fitted on donors only and are reported alongside unit
        weights
      - the estimate reduces to the DiD estimate when weights are uniform, and
        a test asserts that identity
      - refusal reasons are distinct from A-SCM-001's, so a caller can tell
        which stage refused
    tests: tests/test_market_synthetic_did.py
    minimum_data: none
    vertical:
