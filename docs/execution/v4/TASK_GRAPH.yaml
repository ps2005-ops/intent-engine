    minimum_data: none

  - id: H-CEO-001
    program: H
    title: CEO Q&A derived from canonical records
    dependencies: [G-THE-001]
    status: WAITING_DEPENDENCY
    priority: 4
    acceptance_criteria:
      - answers trace canonical records; no new facts invented under repeated
        "why?"
      - the eleven standing questions are answerable
    minimum_data: none

  - id: H-CEO-002
    program: H
    title: CEO challenge mode -- refuse a leading premise
    dependencies: [H-CEO-001]
    status: WAITING_DEPENDENCY
    priority: 4
    acceptance_criteria:
      - a leading premise such as -- tell me why demand is collapsing -- is
        refused when the evidence does not show it, and answered instead with
        the evidence, the leading thesis, the alternative, and the missing test
    minimum_data: none

  - id: H-CON-001
    program: H
    title: Standing consistency wall across thesis/proof/presentation/Q&A
